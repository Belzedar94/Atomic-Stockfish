name: NNUE refresh check pull request, profile-guided

# Measures pull request #77 (remove the requires_refresh() checks from the
# forward accumulator updates of Legacy Atomic V1 and AtomicNNUEV2, since the
# backward scan before them already stops at every accumulator that needs a
# refresh) against main@8e81598f, its base. The pull request claims the
# evaluation is unchanged, so it must search exactly the nodes main searches.
# ci/build_variants.sh builds main and main with the pull request head merged,
# one after the other on one runner, with `make profile-build` (GCC, as
# OpenBench and the AtomicDB workers build). ci/engine_check.py then requires
# both to search exactly the nodes main searches (bench signature, a
# worker-like UCI session, every timed bench) and times them in alternating
# rounds. The same binaries are timed on several runners of each kind, and
# ci/pool_checks.py pools the per-round ratios.
#
# The engine is NNUE-only since #76, so there is no classical bench. The
# default network (atomic_run3b_e202_l05.nnue) is a Legacy Atomic V1 network.
# AtomicNNUEV2 networks are external-only; the second check of every runner
# loads the synthetic AtomicNNUEV2 fixture that main's own CI generates
# (tests/create_synthetic_atomic_v2_nnue.py, pinned by its sha256) and
# requires the same identity on it, with a short timed bench.
#
# Nothing is published: binaries and reports are artifacts.

on:
  push:
    branches:
      - ci/moky-refresh-once-1022

permissions:
  contents: read

concurrency:
  group: moky-refresh-once-1022
  cancel-in-progress: true

env:
  MAIN_SHA: 8e81598f0dc8133fc3ee24ba6128327af58f4534
  PR77_SHA: fb6de014bcd5876389b3e250ca39275c3bdc5637
  # Trees of main and of main with the pull request merged: the build stops if a
  # variant is anything else.
  TREE_MAIN: db484fb1c8114260c9fd7791920576cbd4c7988f
  TREE_PR77: 53512f3353eb6c160a13e21c93b231f1ff4a63fc
  ATOMIC_NET_TAG: v1.0
  ATOMIC_NET_ASSET: atomic-run3b.nnue
  ATOMIC_NET_SHA256: 99dc67eabf26a64faeeca3a88b4c38597a840b8d4a874b9f2cf658c6f92a04a6
  NET_NAME: atomic_run3b_e202_l05.nnue
  V1_BACKEND: Legacy Atomic V1
  EXPECT_BENCH: "438711"
  BENCH_DEPTH: "20"
  # A multiple of 4: with two binaries each one goes first in half of the rounds,
  # in ABBA order, so a slow drift of the runner's speed cancels out.
  ROUNDS: "20"
  # The synthetic AtomicNNUEV2 network of main's CI (ATOMIC_SYNTHETIC_V2_NNUE_SHA256).
  V2_NET: atomic-v2-synthetic.nnue
  V2_NET_SHA256: 4deb05cff79b5d5eba51c560f64ed24224671c188b6c5db27521033e587c87c6
  V2_BENCH_DEPTH: "16"
  V2_ROUNDS: "8"

jobs:
  v2net:
    name: synthetic AtomicNNUEV2 network (main's CI fixture)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.MAIN_SHA }}
          path: engine
          persist-credentials: false

      - name: Generate it with main's script
        run: |
          set -eo pipefail
          python3 --version
          python3 engine/tests/create_synthetic_atomic_v2_nnue.py --output "v2net/$V2_NET"
          echo "$V2_NET_SHA256  v2net/$V2_NET" | sha256sum -c -
          ls -l v2net

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v2net
          path: v2net/
          if-no-files-found: error
          overwrite: true

  build-linux:
    name: build linux x86-64-avx2 (gcc, profile-build)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.MAIN_SHA }}
          path: engine
          fetch-depth: 0
          persist-credentials: false

      - name: Toolchain and host
        run: |
          g++ --version | head -n 1
          lscpu | grep -E 'Model name|^CPU\(s\)'
          git -C engine log -1 --format='main: %H %s'

      - name: Network
        run: |
          mkdir -p net
          curl -sSfL --retry 3 -o "net/$NET_NAME" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$ATOMIC_NET_TAG/$ATOMIC_NET_ASSET"
          echo "$ATOMIC_NET_SHA256  net/$NET_NAME" | sha256sum -c -

      - name: Profile-guided builds of main and the pull request
        run: bash ci/build_variants.sh engine "net/$NET_NAME" out "" ARCH=x86-64-avx2 COMP=gcc

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bins-linux
          path: out/
          if-no-files-found: error
          overwrite: true

  measure-linux:
    name: time linux x86-64-avx2, runner ${{ matrix.runner }}
    needs: [build-linux, v2net]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bins-linux
          path: bins
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: v2net
          path: v2net

      # The Linux binaries read the default network from the run directory, under
      # its default name, as in the earlier measurements of this lineage.
      - name: Networks and host
        run: |
          chmod +x bins/atomic-*
          mkdir -p run out
          curl -sSfL --retry 3 -o "run/$NET_NAME" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$ATOMIC_NET_TAG/$ATOMIC_NET_ASSET"
          echo "$ATOMIC_NET_SHA256  run/$NET_NAME" | sha256sum -c -
          lscpu | grep -E 'Model name|^CPU\(s\)'

      - name: Identity and speed, default network (Legacy Atomic V1)
        run: |
          set -eo pipefail
          cpu=$(lscpu | sed -n 's/^Model name: *//p' | head -n 1)
          python3 ci/engine_check.py --title "linux x86-64-avx2, runner ${{ matrix.runner }}: $cpu" --net v1 \
            --bin main=bins/atomic-main --bin pr77=bins/atomic-pr77 \
            --cwd run --expect-backend "$V1_BACKEND" --expect-bench "$EXPECT_BENCH" \
            --depth "$BENCH_DEPTH" --rounds "$ROUNDS" \
            --json out/check.json --md "$GITHUB_STEP_SUMMARY" | tee out/check.log

      - name: Identity and short timing, synthetic AtomicNNUEV2 network
        if: success() || failure()
        run: |
          set -eo pipefail
          echo "$V2_NET_SHA256  v2net/$V2_NET" | sha256sum -c -
          cpu=$(lscpu | sed -n 's/^Model name: *//p' | head -n 1)
          python3 ci/engine_check.py --title "linux x86-64-avx2, runner ${{ matrix.runner }}, synthetic AtomicNNUEV2: $cpu" \
            --net v2-synthetic --evalfile "v2net/$V2_NET" \
            --bin main=bins/atomic-main --bin pr77=bins/atomic-pr77 \
            --cwd run --expect-backend AtomicNNUEV2 \
            --depth "$V2_BENCH_DEPTH" --rounds "$V2_ROUNDS" --timeout 900 \
            --json out/check-v2.json --md "$GITHUB_STEP_SUMMARY" | tee out/check-v2.log

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: check-linux-${{ matrix.runner }}
          path: out/
          overwrite: true

  build-windows:
    name: build windows x86-64-bmi2 (MSYS2 gcc, profile-build)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.MAIN_SHA }}
          path: engine
          fetch-depth: 0
          persist-credentials: false

      - name: Set up MSYS2
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: mingw64
          path-type: inherit
          install: >-
            make
            mingw-w64-x86_64-gcc

      - name: Toolchain and host
        run: |
          g++ --version | head -n 1
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" || true
          echo "processors: $NUMBER_OF_PROCESSORS"
          git -C engine log -1 --format='main: %H %s'

      - name: Network
        run: |
          mkdir -p net
          curl -sSfL --retry 3 -o "net/$NET_NAME" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$ATOMIC_NET_TAG/$ATOMIC_NET_ASSET"
          echo "$ATOMIC_NET_SHA256  net/$NET_NAME" | sha256sum -c -

      # The network is embedded, as in the Windows binaries the workers download.
      - name: Profile-guided builds of main and the pull request
        run: |
          bash ci/build_variants.sh engine "net/$NET_NAME" out .exe ARCH=x86-64-bmi2 COMP=mingw \
            EXTRAPROFILEFLAGS=-DATOMIC_NNUE_EMBEDDING
          for f in out/atomic-*.exe; do test "$(wc -c < "$f")" -gt "$(wc -c < "net/$NET_NAME")"; done
          objdump -p out/atomic-main.exe | grep "DLL Name"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bins-windows
          path: out/
          if-no-files-found: error
          compression-level: 1
          overwrite: true

  measure-windows:
    name: time windows x86-64-bmi2, runner ${{ matrix.runner }}
    needs: [build-windows, v2net]
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bins-windows
          path: bins
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: v2net
          path: v2net

      # The run directory holds no .nnue: a completed bench with the default
      # network can only come from the embedded one.
      - name: Identity and speed, default network (Legacy Atomic V1)
        run: |
          set -eo pipefail
          mkdir -p run out
          test -z "$(ls run/*.nnue bins/*.nnue 2>/dev/null)"
          cpu=$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" | tr -d '\r')
          echo "$cpu, $NUMBER_OF_PROCESSORS processors"
          python --version
          python ci/engine_check.py --title "windows x86-64-bmi2, runner ${{ matrix.runner }}: $cpu" --net v1 \
            --bin main=bins/atomic-main.exe --bin pr77=bins/atomic-pr77.exe \
            --cwd run --expect-backend "$V1_BACKEND" --expect-bench "$EXPECT_BENCH" \
            --depth "$BENCH_DEPTH" --rounds "$ROUNDS" \
            --json out/check.json --md "$GITHUB_STEP_SUMMARY" | tee out/check.log

      - name: Identity and short timing, synthetic AtomicNNUEV2 network
        if: success() || failure()
        run: |
          set -eo pipefail
          mkdir -p run out
          echo "$V2_NET_SHA256  v2net/$V2_NET" | sha256sum -c -
          cpu=$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" | tr -d '\r')
          python ci/engine_check.py --title "windows x86-64-bmi2, runner ${{ matrix.runner }}, synthetic AtomicNNUEV2: $cpu" \
            --net v2-synthetic --evalfile "v2net/$V2_NET" \
            --bin main=bins/atomic-main.exe --bin pr77=bins/atomic-pr77.exe \
            --cwd run --expect-backend AtomicNNUEV2 \
            --depth "$V2_BENCH_DEPTH" --rounds "$V2_ROUNDS" --timeout 900 \
            --json out/check-v2.json --md "$GITHUB_STEP_SUMMARY" | tee out/check-v2.log

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: check-windows-${{ matrix.runner }}
          path: out/
          overwrite: true

  pool:
    name: pooled ratios
    needs: [measure-linux, measure-windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: check-*
          path: checks
      - name: Pool the per-round ratios
        run: |
          set -eo pipefail
          ls checks/*/check*.json
          python3 ci/pool_checks.py checks/*/check*.json --md "$GITHUB_STEP_SUMMARY" --json pooled.json | tee pooled.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pooled
          path: |
            pooled.md
            pooled.json
          overwrite: true
