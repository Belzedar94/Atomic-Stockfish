name: AVX2 attacks (#87), clang, profile-guided

# Measures the AVX2 attacks (a908e669, pull request #87, a port of upstream
# Stockfish 82d73d0a and 205f0052 on the AVX2 both_attacks_bb() path), merged
# into main as c2736596, against 00f68d61, main before #87: the variant called
# main below is 00f68d61. #87 went in on an OpenBench non-regression run,
# which cannot resolve a 1% speed difference. The commit claims the search is
# unchanged, so it must search exactly the nodes 00f68d61 searches, and with
# it merged the tree is exactly the one of c2736596.
# ci/build_variants.sh builds 00f68d61 and 00f68d61 with the commit merged,
# one after the other on one runner, with `make profile-build` and clang 23,
# as the AtomicDB worker engines are published (ci/worker-engine-pgo-1028).
# Run 41330373747 timed the same pair built with GCC. ci/engine_check.py then
# requires
# both to search exactly the nodes main searches (bench signature, a
# worker-like UCI session, every timed bench) and times them in alternating
# rounds. The same binaries are timed on several runners of each kind, and
# ci/pool_checks.py pools the per-round ratios.
#
# The engine is NNUE-only since #76, so there is no classical bench. The
# default network (atomic_run3b_e202_l05.nnue) is a Legacy Atomic V1 network.
# AtomicNNUEV2 networks are external-only. The change is not in NNUE code, so
# the second check of every runner is only a cheap extra: it loads the
# synthetic AtomicNNUEV2 fixture that main's own CI generates
# (tests/create_synthetic_atomic_v2_nnue.py, pinned by its sha256) and
# requires the same identity on it, with a short timed bench. Its benches are
# node-limited: with this fixture the default depth-13 bench of main did not
# finish within 15 minutes on any runner (run 39748666706).
#
# Nothing is published: binaries and reports are artifacts.

on:
  push:
    branches:
      - ci/avx2-clang-1101

permissions:
  contents: read

concurrency:
  group: avx2-clang-1101
  cancel-in-progress: true

env:
  MAIN_SHA: 00f68d61ddf1e5730956f51fcbfed1d072e54131
  AVX2_SHA: a908e669481c56266bf39b6f6f2bd93c7b289957
  # Trees of 00f68d61 and of 00f68d61 with the commit merged (the tree of
  # c2736596): the build stops if a variant is anything else.
  TREE_MAIN: 98e9d440009fc25b917f11ece03bb30e65591e43
  TREE_AVX2: 94958d08f8324097a188dd13b3ae5ac0a9bc556c
  ATOMIC_NET_TAG: v1.0
  ATOMIC_NET_ASSET: atomic-run3b.nnue
  ATOMIC_NET_SHA256: 99dc67eabf26a64faeeca3a88b4c38597a840b8d4a874b9f2cf658c6f92a04a6
  NET_NAME: atomic_run3b_e202_l05.nnue
  V1_BACKEND: Legacy Atomic V1
  EXPECT_BENCH: "433197"
  # The LLVM release the published Linux worker engine is built with (apt.llvm.org).
  LLVM_VERSION: "23"
  BENCH_DEPTH: "20"
  # A multiple of 4: with two binaries each one goes first in half of the rounds,
  # in ABBA order, so a slow drift of the runner's speed cancels out.
  ROUNDS: "20"
  # The synthetic AtomicNNUEV2 network of main's CI (ATOMIC_SYNTHETIC_V2_NNUE_SHA256).
  V2_NET: atomic-v2-synthetic.nnue
  V2_NET_SHA256: 4deb05cff79b5d5eba51c560f64ed24224671c188b6c5db27521033e587c87c6
  # Nodes per bench position: signature bench and timed bench.
  V2_SIGNATURE_NODES: "50000"
  V2_TIMED_NODES: "100000"
  V2_ROUNDS: "8"

jobs:
  v2net:
    name: synthetic AtomicNNUEV2 network (main's CI fixture)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.MAIN_SHA }}
          path: engine
          persist-credentials: false

      - name: Generate it with main's script
        run: |
          set -eo pipefail
          python3 --version
          python3 engine/tests/create_synthetic_atomic_v2_nnue.py --output "v2net/$V2_NET"
          echo "$V2_NET_SHA256  v2net/$V2_NET" | sha256sum -c -
          ls -l v2net

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v2net
          path: v2net/
          if-no-files-found: error
          overwrite: true

  build-linux:
    name: build linux x86-64-avx2 (clang 23, profile-build)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.MAIN_SHA }}
          path: engine
          fetch-depth: 0
          persist-credentials: false

      # The LLVM project's own packages, installed with its llvm.sh and an explicit
      # version, plus llvm-N, which holds the llvm-profdata that must match the
      # compiler, as in ci/worker-engine-pgo-1028.
      - name: Install clang ${{ env.LLVM_VERSION }} from apt.llvm.org
        run: |
          log="$RUNNER_TEMP/llvm-install.log"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/llvm.sh" https://apt.llvm.org/llvm.sh
          sudo bash "$RUNNER_TEMP/llvm.sh" "$LLVM_VERSION" > "$log" 2>&1 || { tail -n 40 "$log"; exit 1; }
          sudo apt-get install -y "llvm-$LLVM_VERSION" >> "$log" 2>&1 || { tail -n 40 "$log"; exit 1; }

      - name: Toolchain and host
        run: |
          "clang++-$LLVM_VERSION" --version | head -n 1
          lscpu | grep -E 'Model name|^CPU\(s\)'
          git -C engine log -1 --format='main: %H %s'

      - name: Network
        run: |
          mkdir -p net
          curl -sSfL --retry 3 -o "net/$NET_NAME" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$ATOMIC_NET_TAG/$ATOMIC_NET_ASSET"
          echo "$ATOMIC_NET_SHA256  net/$NET_NAME" | sha256sum -c -

      - name: Profile-guided builds of 00f68d61 and the AVX2 attacks
        run: |
          set -eo pipefail
          bash ci/build_variants.sh engine "net/$NET_NAME" out "" ARCH=x86-64-avx2 COMP=clang \
            CXX="clang++-$LLVM_VERSION" RTLIB=compiler-rt
          for f in out/build-*.log; do grep -q "/usr/lib/llvm-$LLVM_VERSION/bin/llvm-profdata merge" "$f"; done
          for f in out/atomic-main out/atomic-avx2; do readelf -p .comment "$f" | grep -q "clang version $LLVM_VERSION\."; done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bins-linux
          path: out/
          if-no-files-found: error
          overwrite: true

  measure-linux:
    name: time linux x86-64-avx2, runner ${{ matrix.runner }}
    needs: [build-linux, v2net]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bins-linux
          path: bins
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: v2net
          path: v2net

      # The Linux binaries read the default network from the run directory, under
      # its default name, as in the earlier measurements of this lineage.
      - name: Networks and host
        run: |
          chmod +x bins/atomic-*
          mkdir -p run out
          curl -sSfL --retry 3 -o "run/$NET_NAME" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$ATOMIC_NET_TAG/$ATOMIC_NET_ASSET"
          echo "$ATOMIC_NET_SHA256  run/$NET_NAME" | sha256sum -c -
          lscpu | grep -E 'Model name|^CPU\(s\)'

      - name: Identity and speed, default network (Legacy Atomic V1)
        run: |
          set -eo pipefail
          cpu=$(lscpu | sed -n 's/^Model name: *//p' | head -n 1)
          python3 ci/engine_check.py --title "linux x86-64-avx2, runner ${{ matrix.runner }}: $cpu" --net v1 \
            --bin main=bins/atomic-main --bin avx2=bins/atomic-avx2 \
            --cwd run --expect-backend "$V1_BACKEND" --expect-bench "$EXPECT_BENCH" \
            --depth "$BENCH_DEPTH" --rounds "$ROUNDS" \
            --json out/check.json --md "$GITHUB_STEP_SUMMARY" | tee out/check.log

      - name: Identity and short timing, synthetic AtomicNNUEV2 network
        if: success() || failure()
        timeout-minutes: 30
        run: |
          set -eo pipefail
          echo "$V2_NET_SHA256  v2net/$V2_NET" | sha256sum -c -
          cpu=$(lscpu | sed -n 's/^Model name: *//p' | head -n 1)
          python3 ci/engine_check.py --title "linux x86-64-avx2, runner ${{ matrix.runner }}, synthetic AtomicNNUEV2: $cpu" \
            --net v2-synthetic --evalfile "v2net/$V2_NET" \
            --bin main=bins/atomic-main --bin avx2=bins/atomic-avx2 \
            --cwd run --expect-backend AtomicNNUEV2 \
            --limit-type nodes --signature-limit "$V2_SIGNATURE_NODES" --limit "$V2_TIMED_NODES" \
            --rounds "$V2_ROUNDS" --timeout 600 --session-timeout 900 \
            --json out/check-v2.json --md "$GITHUB_STEP_SUMMARY" | tee out/check-v2.log

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: check-linux-${{ matrix.runner }}
          path: out/
          overwrite: true

  build-windows:
    name: build windows x86-64-bmi2 (MSYS2 clang, profile-build)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.MAIN_SHA }}
          path: engine
          fetch-depth: 0
          persist-credentials: false

      # As in ci/worker-engine-pgo-1028: the newest clang MSYS2 packages (clang64,
      # libc++ linked statically), with the package databases brought up to date
      # first.
      - name: Set up MSYS2 with its newest clang
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: mingw64
          path-type: inherit
          update: true
          install: >-
            make
            mingw-w64-x86_64-binutils
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm

      - name: Toolchain and host
        run: |
          /clang64/bin/clang++ --version | head -n 1
          /clang64/bin/llvm-profdata --version | grep -i "llvm version"
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" || true
          echo "processors: $NUMBER_OF_PROCESSORS"
          git -C engine log -1 --format='main: %H %s'

      - name: Network
        run: |
          mkdir -p net
          curl -sSfL --retry 3 -o "net/$NET_NAME" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$ATOMIC_NET_TAG/$ATOMIC_NET_ASSET"
          echo "$ATOMIC_NET_SHA256  net/$NET_NAME" | sha256sum -c -

      # The network is embedded, as in the Windows binaries the workers download. As
      # in the published recipe, the clang PGO recipe replaces EXTRACXXFLAGS and does
      # not read EXTRAPROFILEFLAGS, so the embedding flag goes in through the
      # environment, and libc++ 23 gets back the transitive includes numa.h needs.
      - name: Profile-guided builds of 00f68d61 and the AVX2 attacks
        run: |
          set -eo pipefail
          export PATH="/clang64/bin:$PATH"
          CXXFLAGS="-DATOMIC_NNUE_EMBEDDING -D_LIBCPP_KEEP_TRANSITIVE_INCLUDES_LLVM23" \
            bash ci/build_variants.sh engine "net/$NET_NAME" out .exe ARCH=x86-64-bmi2 COMP=clang
          for f in out/build-*.log; do grep -q -- "-fprofile-use=stockfish.profdata" "$f"; done
          for f in out/atomic-*.exe; do test "$(wc -c < "$f")" -gt "$(wc -c < "net/$NET_NAME")"; done
          objdump -p out/atomic-main.exe | grep "DLL Name"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bins-windows
          path: out/
          if-no-files-found: error
          compression-level: 1
          overwrite: true

  measure-windows:
    name: time windows x86-64-bmi2, runner ${{ matrix.runner }}
    needs: [build-windows, v2net]
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bins-windows
          path: bins
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: v2net
          path: v2net

      # The run directory holds no .nnue: a completed bench with the default
      # network can only come from the embedded one.
      - name: Identity and speed, default network (Legacy Atomic V1)
        run: |
          set -eo pipefail
          mkdir -p run out
          test -z "$(ls run/*.nnue bins/*.nnue 2>/dev/null)"
          cpu=$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" | tr -d '\r')
          echo "$cpu, $NUMBER_OF_PROCESSORS processors"
          python --version
          python ci/engine_check.py --title "windows x86-64-bmi2, runner ${{ matrix.runner }}: $cpu" --net v1 \
            --bin main=bins/atomic-main.exe --bin avx2=bins/atomic-avx2.exe \
            --cwd run --expect-backend "$V1_BACKEND" --expect-bench "$EXPECT_BENCH" \
            --depth "$BENCH_DEPTH" --rounds "$ROUNDS" \
            --json out/check.json --md "$GITHUB_STEP_SUMMARY" | tee out/check.log

      - name: Identity and short timing, synthetic AtomicNNUEV2 network
        if: success() || failure()
        timeout-minutes: 30
        run: |
          set -eo pipefail
          mkdir -p run out
          echo "$V2_NET_SHA256  v2net/$V2_NET" | sha256sum -c -
          cpu=$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" | tr -d '\r')
          python ci/engine_check.py --title "windows x86-64-bmi2, runner ${{ matrix.runner }}, synthetic AtomicNNUEV2: $cpu" \
            --net v2-synthetic --evalfile "v2net/$V2_NET" \
            --bin main=bins/atomic-main.exe --bin avx2=bins/atomic-avx2.exe \
            --cwd run --expect-backend AtomicNNUEV2 \
            --limit-type nodes --signature-limit "$V2_SIGNATURE_NODES" --limit "$V2_TIMED_NODES" \
            --rounds "$V2_ROUNDS" --timeout 600 --session-timeout 900 \
            --json out/check-v2.json --md "$GITHUB_STEP_SUMMARY" | tee out/check-v2.log

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: check-windows-${{ matrix.runner }}
          path: out/
          overwrite: true

  pool:
    name: pooled ratios
    needs: [measure-linux, measure-windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: check-*
          path: checks
      - name: Pool the per-round ratios
        run: |
          set -eo pipefail
          ls checks/*/check*.json
          python3 ci/pool_checks.py checks/*/check*.json --md "$GITHUB_STEP_SUMMARY" --json pooled.json | tee pooled.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pooled
          path: |
            pooled.md
            pooled.json
          overwrite: true
