name: CPU profile of the AtomicDB worker engine (clang 23 PGO, perf)

# Profiles main 722b4735 built as the published Linux AtomicDB worker engine is
# built (ci/worker-engine-pgo-1028): make profile-build ARCH=x86-64-avx2
# COMP=clang CXX=clang++-23 RTLIB=compiler-rt, with the default network
# (atomic_run3b_e202_l05.nnue, Legacy Atomic V1) embedded. A second build adds -g
# and nothing else; its .text section is compared byte for byte with the first
# one, and it is the binary that is recorded, so that samples can be attributed to
# inlined functions. Both must give bench 433197 and the same worker-like session.
#
# The load (ci/atomicdb_load.py, seeds in ci/profile_seeds.tsv) is shaped like
# AtomicDB tasks: go nodes 3M per position, Hash 256, no ucinewgame anywhere, and
# each seed followed by the positions after its best moves (related positions in a
# row). 24 open positions and 16 decided ones from the mate battery. Three passes,
# each recorded with perf (call graphs from a copy of the top of the stack):
# MultiPV 1 and MultiPV 5 with one thread, and a short MultiPV 5 pass with four
# threads. ci/perf_attr.py attributes the samples to source functions.
#
# This branch holds no engine source and nothing is published: everything is an
# artifact. Report only, no patch.

on:
  push:
    branches:
      - ci/profile-1102
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-1102
  cancel-in-progress: true

env:
  ENGINE_SHA: 722b47357803895e9f47b30caec381087dcf4a44
  TREE: 98e9d440009fc25b917f11ece03bb30e65591e43
  ATOMIC_NET_TAG: v1.0
  ATOMIC_NET_ASSET: atomic-run3b.nnue
  ATOMIC_NET_SHA256: 99dc67eabf26a64faeeca3a88b4c38597a840b8d4a874b9f2cf658c6f92a04a6
  NET_NAME: atomic_run3b_e202_l05.nnue
  V1_BACKEND: Legacy Atomic V1
  EXPECT_BENCH: "433197"
  LLVM_VERSION: "23"
  NODES: "3000000"
  WALK: "3"
  FREQ: "300"
  STACK: "16384"
  T4_SEEDS: "open01,open02,open03,open04,open05,open06,open07,open08,W5#9p,L6-7#12p,W8-10#15p,H11-15#29p"

jobs:
  profile:
    name: perf profile, linux x86-64-avx2 (clang 23, profile-build)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.ENGINE_SHA }}
          path: engine
          persist-credentials: false

      - name: The engine tree is main 722b4735
        run: test "$(git -C engine rev-parse 'HEAD^{tree}')" = "$TREE"

      - name: Install clang ${{ env.LLVM_VERSION }} (apt.llvm.org) and perf
        run: |
          mkdir -p out bins run
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/llvm.sh" https://apt.llvm.org/llvm.sh
          sudo bash "$RUNNER_TEMP/llvm.sh" "$LLVM_VERSION" > out/llvm-install.log 2>&1 || { tail -n 40 out/llvm-install.log; exit 1; }
          sudo apt-get install -y "llvm-$LLVM_VERSION" >> out/llvm-install.log 2>&1 || { tail -n 40 out/llvm-install.log; exit 1; }
          k=$(uname -r)
          sudo apt-get install -y "linux-tools-$k" linux-tools-common > out/perf-install.log 2>&1 \
            || sudo apt-get install -y linux-tools-azure linux-tools-common >> out/perf-install.log 2>&1 \
            || sudo apt-get install -y linux-tools-generic linux-tools-common >> out/perf-install.log 2>&1 \
            || { tail -n 30 out/perf-install.log; echo "::warning::no perf package installed"; }
          ls -d /usr/lib/linux-tools/*/ 2>/dev/null || true

      - name: Toolchain and host
        run: |
          "clang++-$LLVM_VERSION" --version | head -n 1
          "llvm-symbolizer-$LLVM_VERSION" --version | head -n 2
          uname -a
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|MHz|L1d|L2|L3'
          grep -E 'MemTotal|MemAvailable' /proc/meminfo
          df -h . | tail -n 1
          git -C engine log -1 --format='engine: %H %s'

      - name: Network
        run: |
          curl -sSfL --retry 3 -o "engine/src/$NET_NAME" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$ATOMIC_NET_TAG/$ATOMIC_NET_ASSET"
          echo "$ATOMIC_NET_SHA256  engine/src/$NET_NAME" | sha256sum -c -

      # The recipe of the published Linux worker engine, plus the embedding flag, which
      # the clang PGO recipe only reads from the environment (ENV_CXXFLAGS). The second
      # build adds -g and nothing else.
      - name: Profile-guided builds (recipe, and recipe + -g)
        working-directory: engine/src
        run: |
          set -eo pipefail
          for v in "atomic-pgo:" "atomic-pgo-g:-g"; do
            exe=${v%%:*}; extra=${v#*:}
            rc=0
            CXXFLAGS="-DATOMIC_NNUE_EMBEDDING $extra" make -j4 profile-build ARCH=x86-64-avx2 COMP=clang \
              CXX="clang++-$LLVM_VERSION" RTLIB=compiler-rt EXE="$exe" > "../../out/build-$exe.log" 2>&1 || rc=$?
            grep -E "^Step|Nodes searched|Nodes/second|WARNING|llvm-profdata merge" "../../out/build-$exe.log" || true
            if [ "$rc" -ne 0 ]; then tail -n 60 "../../out/build-$exe.log"; exit "$rc"; fi
            if grep -q "WARNING: the profiling run found no NNUE network" "../../out/build-$exe.log"; then
              echo "::error::$exe: the profiling run had no network"; exit 1
            fi
            grep -q "Nodes searched  : $EXPECT_BENCH" "../../out/build-$exe.log"
            grep -q "/usr/lib/llvm-$LLVM_VERSION/bin/llvm-profdata merge" "../../out/build-$exe.log"
            readelf -p .comment "$exe" | grep -q "clang version $LLVM_VERSION\."
            test "$(wc -c < "$exe")" -gt "$(wc -c < "$NET_NAME")"
            cp "$exe" ../../bins/
            make objclean profileclean > /dev/null 2>&1 || true
          done
          ls -l ../../bins

      - name: The -g build has the same machine code
        run: |
          set -eo pipefail
          for b in atomic-pgo atomic-pgo-g; do
            "llvm-objcopy-$LLVM_VERSION" -O binary --only-section=.text "bins/$b" "out/$b.text"
          done
          sha256sum out/atomic-pgo.text out/atomic-pgo-g.text | tee out/text-identity.txt
          if cmp -s out/atomic-pgo.text out/atomic-pgo-g.text; then
            echo "IDENTICAL .text" | tee -a out/text-identity.txt
          else
            echo "::warning::the -g build has a different .text"; echo "DIFFERENT .text" | tee -a out/text-identity.txt
          fi
          readelf -SW bins/atomic-pgo | grep -E ' \.text ' | tee -a out/text-identity.txt
          readelf -SW bins/atomic-pgo-g | grep -E ' \.text ' | tee -a out/text-identity.txt
          rm out/*.text

      - name: Identity of the two builds (bench, worker-like session)
        run: |
          set -eo pipefail
          test -z "$(ls run/*.nnue 2>/dev/null)"
          python3 ci/engine_check.py --title "linux x86-64-avx2 clang $LLVM_VERSION PGO: recipe vs recipe + -g" \
            --net v1 --bin pgo=bins/atomic-pgo --bin pgo-g=bins/atomic-pgo-g --cwd run \
            --expect-backend "$V1_BACKEND" --expect-bench "$EXPECT_BENCH" --rounds 0 \
            --json out/identity.json --md "$GITHUB_STEP_SUMMARY" | tee out/identity.log

      - name: perf setup
        id: perf
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 kernel.perf_event_mlock_kb=262144
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -n 1)
          if [ -z "$PERF" ] || ! "$PERF" version; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::warning::perf is not usable"; exit 0
          fi
          echo "PERF=$PERF" >> "$GITHUB_ENV"
          "$PERF" stat -e cycles:u,instructions:u -x, -- bins/atomic-pgo-g compiler > /dev/null 2> out/perf-hw-check.txt || true
          cat out/perf-hw-check.txt
          if grep -qE '^[0-9]+,,cycles' out/perf-hw-check.txt; then ev="cycles:u"; hw=true; else ev="cpu-clock:u"; hw=false; fi
          echo "EVENT=$ev" >> "$GITHUB_ENV"; echo "HW=$hw" >> "$GITHUB_ENV"
          if "$PERF" record -e "$ev" -F "$FREQ" --call-graph "dwarf,$STACK" -o "$RUNNER_TEMP/t.data" -- bins/atomic-pgo-g compiler > /dev/null 2> out/perf-record-check.txt; then
            echo "ok=true" >> "$GITHUB_OUTPUT"; echo "event $ev, hardware counters $hw"
          else
            cat out/perf-record-check.txt; echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::warning::perf record failed"
          fi

      - name: "Pass 1: MultiPV 1, one thread"
        if: steps.perf.outputs.ok == 'true'
        run: |
          set -eo pipefail
          python3 ci/atomicdb_load.py --engine bins/atomic-pgo-g --seeds ci/profile_seeds.tsv --cwd run \
            --nodes "$NODES" --multipv 1 --walk "$WALK" --threads 1 --out out/load-mpv1.jsonl \
            --wrap "$PERF record -e $EVENT -F $FREQ --call-graph dwarf,$STACK -o $RUNNER_TEMP/mpv1.data --" \
            | tee out/load-mpv1.log | tail -n 3

      - name: "Pass 2: MultiPV 5, one thread"
        if: steps.perf.outputs.ok == 'true'
        run: |
          set -eo pipefail
          python3 ci/atomicdb_load.py --engine bins/atomic-pgo-g --seeds ci/profile_seeds.tsv --cwd run \
            --nodes "$NODES" --multipv 5 --walk "$WALK" --threads 1 --out out/load-mpv5.jsonl \
            --wrap "$PERF record -e $EVENT -F $FREQ --call-graph dwarf,$STACK -o $RUNNER_TEMP/mpv5.data --" \
            | tee out/load-mpv5.log | tail -n 3

      - name: "Pass 3: MultiPV 5, four threads (short)"
        if: steps.perf.outputs.ok == 'true'
        run: |
          set -eo pipefail
          python3 ci/atomicdb_load.py --engine bins/atomic-pgo-g --seeds ci/profile_seeds.tsv --cwd run \
            --nodes 8000000 --multipv 5 --walk 2 --threads 4 --select "$T4_SEEDS" --out out/load-t4.jsonl \
            --wrap "$PERF record -e $EVENT -F $FREQ --call-graph dwarf,$STACK -o $RUNNER_TEMP/t4.data --" \
            | tee out/load-t4.log | tail -n 3

      - name: Attribution
        if: steps.perf.outputs.ok == 'true'
        run: |
          set -eo pipefail
          for p in mpv1 mpv5 t4; do
            d="$RUNNER_TEMP/$p.data"
            "$PERF" report -i "$d" --no-children --no-inline -g none --sort sym --stdio --percent-limit 0.2 > "out/report-flat-$p.txt" 2> /dev/null || true
            "$PERF" script -i "$d" --no-inline -F comm,tid,ip,sym,dso --show-mmap-events > "$RUNNER_TEMP/$p.script" 2> "out/script-$p.err" || true
            head -c 3000 "$RUNNER_TEMP/$p.script"; echo; grep -m 3 PERF_RECORD_MMAP "$RUNNER_TEMP/$p.script" || true
            python3 ci/perf_attr.py --script "$RUNNER_TEMP/$p.script" --binary bins/atomic-pgo-g \
              --symbolizer "llvm-symbolizer-$LLVM_VERSION" --title "$p ($EVENT, $FREQ Hz)" \
              --json "out/attr-$p.json" --md out/attr.md > "out/attr-$p.log" 2>&1 || { tail -n 30 "out/attr-$p.log"; }
            gzip -c "$RUNNER_TEMP/$p.script" > "out/perf-$p.script.gz"
            rm -f "$RUNNER_TEMP/$p.script" "$d"
          done
          cat out/attr.md >> "$GITHUB_STEP_SUMMARY"
          ls -l out

      # Counting mode, only where the runner exposes hardware counters.
      - name: Hardware counters (counting mode)
        if: steps.perf.outputs.ok == 'true' && env.HW == 'true'
        run: |
          python3 ci/atomicdb_load.py --engine bins/atomic-pgo-g --seeds ci/profile_seeds.tsv --cwd run \
            --nodes "$NODES" --multipv 1 --walk 2 --threads 1 --limit 12 --out out/load-stat.jsonl \
            --wrap "$PERF stat -e cycles:u,instructions:u,branches:u,branch-misses:u,cache-references:u,cache-misses:u,L1-dcache-load-misses:u,dTLB-load-misses:u -o out/perf-stat.txt --" \
            | tail -n 2 || true
          cat out/perf-stat.txt || true

      # Without perf: instruction counts with callgrind on a short load instead.
      - name: callgrind fallback
        if: steps.perf.outputs.ok != 'true'
        run: |
          sudo apt-get install -y valgrind > out/valgrind-install.log 2>&1
          python3 ci/atomicdb_load.py --engine bins/atomic-pgo-g --seeds ci/profile_seeds.tsv --cwd run \
            --nodes 1000000 --multipv 1 --walk 2 --threads 1 --limit 12 --timeout 7000 --out out/load-callgrind.jsonl \
            --wrap "valgrind --tool=callgrind --dump-instr=yes --callgrind-out-file=$PWD/out/callgrind.out" | tail -n 2
          callgrind_annotate --inclusive=no out/callgrind.out > out/callgrind-self.txt || true
          callgrind_annotate --inclusive=yes out/callgrind.out > out/callgrind-incl.txt || true
          gzip out/callgrind.out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: profile-linux
          path: |
            out/
            bins/atomic-pgo-g
          retention-days: 30
          compression-level: 6
