name: Atomic CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}

concurrency:
  group: atomic-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ATOMIC_SYNTHETIC_NNUE_SHA256: 9CF054CA00B82AB53A34473DE52D1104AEDDAA19B2E7B24091B5E613AF485985
  ATOMIC_SYNTHETIC_V2_NNUE_SHA256: 4DEB05CFF79B5D5EBA51C560F64ED24224671C188B6C5DB27521033E587C87C6
  # The checkout becomes dirty with untracked test/build products before some
  # generator targets run. Bind every CI producer to the exact checked-out
  # commit instead of weakening the Makefile's clean-tree fallback.
  GIT_SHA_FULL: ${{ github.sha }}

jobs:
  # The one job that tests the engine OpenBench and the AtomicDB workers run:
  # the default build with the network `make net` fetches, its bench signature
  # against the `Bench:` line of the commit history, the LegacyAtomicV1
  # incremental-accumulator gate with that same network, and a fixed-node
  # battery of proven mates.
  production:
    name: Production engine (make net, bench, V1 incremental, mates)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      # Upstream Stockfish's reference lookup: the newest commit (merge commits
      # included) whose message carries a `Bench: N` line. It relies on
      # pipefail, which `shell: bash` enables and the default shell does not.
      - name: Extract the bench number from the commit history
        shell: bash
        run: |
          for hash in $(git rev-list -100 HEAD); do
            benchref=$(git show -s $hash | tac | grep -m 1 -o -x '[[:space:]]*\b[Bb]ench[ :]\+[1-9][0-9]\{5,7\}\b[[:space:]]*' | sed 's/[^0-9]//g') && break || true
          done
          test -n "$benchref" || { echo "No Bench: line in the last 100 commits"; exit 1; }
          echo "benchref=$benchref" >> "$GITHUB_ENV"
          echo "From commit: $hash"
          echo "Reference bench: $benchref"
      - name: Default build (fetches and embeds the default network)
        working-directory: src
        run: make -j4 ARCH=x86-64-avx2 build
      - name: Bench signature
        working-directory: src
        run: ../tests/signature.sh "$benchref"
      - name: LegacyAtomicV1 incremental gate with the default network
        working-directory: src
        run: |
          net=$(sed -n 's/^.define EvalFileDefaultName "\([^"]*\)".*/\1/p' evaluate.h)
          make -j4 ARCH=x86-64-avx2 atomic-nnue-incremental-tests \
            ATOMIC_NNUE_TEST_NET="$net" ATOMIC_NNUE_TEST_MODE=release
      - name: Proven-mate battery at fixed nodes
        run: >-
          python3 tests/atomic_mate_battery.py
          --engine src/atomic-stockfish
          --nodes 500000
          --min-found 0.9
          --jobs 2

  native:
    name: Native ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            comp: gcc
            cxx: g++
          - compiler: Clang
            comp: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'
      - name: Build portable x86-64
        working-directory: src
        run: make -j2 ARCH=x86-64 COMP=${{ matrix.comp }} COMPCXX=${{ matrix.cxx }} build
      # `make build` fetches the published default network and embeds it. Bench
      # from a directory holding no .nnue, so a completed search can only come
      # from the embedded copy; bench returns 0 even when the search never
      # started, so the node count is the gate.
      - name: Default build embeds the published network
        run: |
          embedcheck="$RUNNER_TEMP/embedcheck"
          rm -rf "$embedcheck"
          mkdir "$embedcheck"
          cp src/atomic-stockfish "$embedcheck/"
          cd "$embedcheck"
          test -z "$(ls ./*.nnue 2>/dev/null)"
          ./atomic-stockfish bench > bench.log 2>&1
          tail -n 4 bench.log
          grep -q "NNUE evaluation using" bench.log
          grep -Eq 'Nodes searched[[:space:]]*:[[:space:]]*[1-9][0-9]*' bench.log
      - name: Network-free UCI and XBoard release smoke
        run: python3 tests/release_protocol_smoke.py --engine src/atomic-stockfish
      - name: C++ rule and shared-API units
        working-directory: src
        run: |
          make -j2 ARCH=x86-64 COMP=${{ matrix.comp }} COMPCXX=${{ matrix.cxx }} atomic-unit-tests
          make -j2 ARCH=x86-64 COMP=${{ matrix.comp }} COMPCXX=${{ matrix.cxx }} atomic-api-tests
          make -j2 ARCH=x86-64 COMP=${{ matrix.comp }} COMPCXX=${{ matrix.cxx }} atomic-nnue-incremental-tests.bin
          make -j2 ARCH=x86-64 COMP=${{ matrix.comp }} COMPCXX=${{ matrix.cxx }} atomic-v2-backend-core-tests.bin
          make -j2 ARCH=x86-64 COMP=${{ matrix.comp }} COMPCXX=${{ matrix.cxx }} atomic-v2-incremental-tests.bin
          make -j2 ARCH=x86-64 COMP=${{ matrix.comp }} COMPCXX=${{ matrix.cxx }} atomic-syzygy-driver
          make -j2 ARCH=x86-64 COMP=${{ matrix.comp }} COMPCXX=${{ matrix.cxx }} legacy-atomic-v1-tests
          make -j2 ARCH=x86-64 COMP=${{ matrix.comp }} COMPCXX=${{ matrix.cxx }} atomic-bin-v2-tests
          make -j2 ARCH=x86-64 COMP=${{ matrix.comp }} COMPCXX=${{ matrix.cxx }} atomic-bin-v2-sink-tests
          make -j2 ARCH=x86-64 COMP=${{ matrix.comp }} COMPCXX=${{ matrix.cxx }} atomic-bin-v2-manifest-tests
          make -j2 ARCH=x86-64 COMP=${{ matrix.comp }} COMPCXX=${{ matrix.cxx }} atomic-bin-v2-manifest-reader-tests
          make -j2 ARCH=x86-64 COMP=${{ matrix.comp }} COMPCXX=${{ matrix.cxx }} atomic-bin-v2-reader-tests
          make -j2 ARCH=x86-64 COMP=${{ matrix.comp }} COMPCXX=${{ matrix.cxx }} data-tools-tests
          make -j2 ARCH=x86-64 COMP=${{ matrix.comp }} COMPCXX=${{ matrix.cxx }} data-generator
      - name: Functional data-generator gate (full on GCC, smoke on Clang)
        run: |
          python3 tests/create_synthetic_zero_nnue.py --output "$RUNNER_TEMP/atomic-zero.nnue"
          mode=--smoke-only
          if [ "${{ matrix.comp }}" = gcc ]; then mode=; fi
          python3 tests/data_generator.py $mode \
            --generator src/atomic-stockfish-data-generator \
            --normal-engine src/atomic-stockfish \
            --net "$RUNNER_TEMP/atomic-zero.nnue" \
            --expected-net-sha256 "$ATOMIC_SYNTHETIC_NNUE_SHA256"
      - name: Dual Legacy V1 and AtomicNNUEV2 engine gate
        run: |
          python3 tests/create_synthetic_atomic_v2_nnue.py --output "$RUNNER_TEMP/atomic-v2.nnue"
          src/atomic-v2-backend-core-tests.bin "$RUNNER_TEMP/atomic-v2.nnue"
          src/atomic-v2-incremental-tests.bin --net "$RUNNER_TEMP/atomic-v2.nnue" --operations 4096 --full-refresh-interval 1
          python3 tests/nnue_v2_modes.py \
            --engine src/atomic-stockfish \
            --legacy-net "$RUNNER_TEMP/atomic-zero.nnue" \
            --legacy-sha256 "$ATOMIC_SYNTHETIC_NNUE_SHA256" \
            --v2-net "$RUNNER_TEMP/atomic-v2.nnue"
      - name: AtomicNNUEV2 pure data-generator smoke
        run: |
          python3 tests/atomic_v2_generator_smoke.py \
            --generator src/atomic-stockfish-data-generator \
            --net "$RUNNER_TEMP/atomic-v2.nnue" \
            --expected-net-sha256 "$ATOMIC_SYNTHETIC_V2_NNUE_SHA256"
      - name: Atomic Syzygy source/domain contract
        run: python3 tests/atomic_syzygy.py --contract-only
      - name: Atomic and Atomic960 perft
        run: ATOMIC_PERFT_NET="$RUNNER_TEMP/atomic-v2.nnue" bash tests/perft.sh src/atomic-stockfish
      - name: Atomic search regressions
        run: python3 tests/atomic_search.py --candidate src/atomic-stockfish
      - name: XBoard protocol
        run: python3 tests/xboard_protocol.py --candidate src/atomic-stockfish

  nnue-v2-simd:
    name: AtomicNNUEV2 ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # general-64 exercises the scalar implementation; the other two lock
        # the production BMI2 and AVX2 vector paths to the same fixture.
        arch: [general-64, x86-64-bmi2, x86-64-avx2]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build optimized engine and AtomicNNUEV2 tests
        run: |
          make -C src -j2 ARCH=${{ matrix.arch }} build
          make -C src -j2 ARCH=${{ matrix.arch }} atomic-v2-backend-core-tests.bin
          make -C src -j2 ARCH=${{ matrix.arch }} atomic-v2-incremental-tests.bin
      - name: Authenticated Legacy V1 and AtomicNNUEV2 SIMD gate
        run: |
          python3 tests/create_synthetic_zero_nnue.py --output "$RUNNER_TEMP/atomic-zero.nnue"
          python3 tests/create_synthetic_atomic_v2_nnue.py --output "$RUNNER_TEMP/atomic-v2.nnue"
          src/atomic-v2-backend-core-tests.bin "$RUNNER_TEMP/atomic-v2.nnue"
          src/atomic-v2-incremental-tests.bin \
            --net "$RUNNER_TEMP/atomic-v2.nnue" \
            --operations 4096 \
            --full-refresh-interval 1
          python3 tests/nnue_v2_modes.py \
            --engine src/atomic-stockfish \
            --legacy-net "$RUNNER_TEMP/atomic-zero.nnue" \
            --legacy-sha256 "$ATOMIC_SYNTHETIC_NNUE_SHA256" \
            --v2-net "$RUNNER_TEMP/atomic-v2.nnue" \
            --timeout 180

  debug:
    name: Debug and assertions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build debug engine
        working-directory: src
        run: make -j2 ARCH=x86-64 COMP=gcc COMPCXX=g++ debug=yes optimize=no build
      - name: Create authenticated Legacy V1 and AtomicNNUEV2 fixtures
        run: |
          python3 tests/create_synthetic_zero_nnue.py --output "$RUNNER_TEMP/atomic-zero.nnue"
          python3 tests/create_synthetic_atomic_v2_nnue.py --output "$RUNNER_TEMP/atomic-v2.nnue"
      - name: Debug units and perft
        run: |
          make -C src -j2 ARCH=x86-64 debug=yes optimize=no atomic-unit-tests
          make -C src -j2 ARCH=x86-64 debug=yes optimize=no atomic-api-tests
          make -C src -j2 ARCH=x86-64 debug=yes optimize=no atomic-nnue-incremental-tests.bin
          make -C src -j2 ARCH=x86-64 debug=yes optimize=no atomic-v2-backend-core-tests.bin
          make -C src -j2 ARCH=x86-64 debug=yes optimize=no atomic-v2-incremental-tests.bin
          make -C src -j2 ARCH=x86-64 debug=yes optimize=no atomic-syzygy-driver
          make -C src -j2 ARCH=x86-64 debug=yes optimize=no legacy-atomic-v1-tests
          make -C src -j2 ARCH=x86-64 debug=yes optimize=no atomic-bin-v2-tests
          make -C src -j2 ARCH=x86-64 debug=yes optimize=no atomic-bin-v2-sink-tests
          make -C src -j2 ARCH=x86-64 debug=yes optimize=no atomic-bin-v2-manifest-tests
          make -C src -j2 ARCH=x86-64 debug=yes optimize=no atomic-bin-v2-manifest-reader-tests
          make -C src -j2 ARCH=x86-64 debug=yes optimize=no atomic-bin-v2-reader-tests
          make -C src -j2 ARCH=x86-64 debug=yes optimize=no data-tools-tests
          make -C src -j2 ARCH=x86-64 debug=yes optimize=no data-generator
          ATOMIC_PERFT_NET="$RUNNER_TEMP/atomic-v2.nnue" bash tests/perft.sh src/atomic-stockfish
          # The suite searches with the material-only NNUE test network; an
          # unoptimized debug build evaluates it far slower than an optimized one.
          python3 tests/atomic_search.py --candidate src/atomic-stockfish --timeout 60
      - name: Functional debug data-generator smoke (Threads=2)
        run: |
          src/atomic-v2-backend-core-tests.bin "$RUNNER_TEMP/atomic-v2.nnue"
          src/atomic-v2-incremental-tests.bin --net "$RUNNER_TEMP/atomic-v2.nnue" --operations 4096 --full-refresh-interval 1
          python3 tests/data_generator.py --smoke-only \
            --generator src/atomic-stockfish-data-generator \
            --normal-engine src/atomic-stockfish \
            --net "$RUNNER_TEMP/atomic-zero.nnue" \
            --expected-net-sha256 "$ATOMIC_SYNTHETIC_NNUE_SHA256"

  debug-clang:
    name: Clang debug/assert smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build Clang debug engine and focused units
        run: |
          make -C src -j2 ARCH=x86-64 COMP=clang COMPCXX=clang++ debug=yes optimize=no build
          make -C src -j2 ARCH=x86-64 COMP=clang COMPCXX=clang++ debug=yes optimize=no atomic-unit-tests
          make -C src -j2 ARCH=x86-64 COMP=clang COMPCXX=clang++ debug=yes optimize=no atomic-api-tests
          make -C src -j2 ARCH=x86-64 COMP=clang COMPCXX=clang++ debug=yes optimize=no atomic-v2-backend-core-tests.bin
      - name: Run Clang debug assertion smoke
        run: |
          python3 tests/create_synthetic_atomic_v2_nnue.py --output "$RUNNER_TEMP/atomic-v2.nnue"
          src/atomic-v2-backend-core-tests.bin "$RUNNER_TEMP/atomic-v2.nnue"
          python3 tests/release_protocol_smoke.py --engine src/atomic-stockfish

  data-generator-windows:
    name: Data generator Windows MinGW
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'
      - name: Set up MinGW
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: mingw64
          path-type: inherit
          install: mingw-w64-x86_64-gcc make
      - name: Build isolated generator and run frozen codec fixture
        run: |
          make -C src -j2 ARCH=x86-64 COMP=mingw build
          make -C src -j2 ARCH=x86-64 COMP=mingw atomic-nnue-incremental-tests.exe
          make -C src -j2 ARCH=x86-64 COMP=mingw atomic-v2-backend-core-tests.exe
          make -C src -j2 ARCH=x86-64 COMP=mingw atomic-v2-incremental-tests.exe
          python tests/create_synthetic_atomic_v2_nnue.py --output "$RUNNER_TEMP/atomic-v2.nnue"
          make -C src -j2 ARCH=x86-64 COMP=mingw data-generator
          make -C src -j2 ARCH=x86-64 COMP=mingw legacy-atomic-v1-tests
          make -C src -j2 ARCH=x86-64 COMP=mingw atomic-bin-v2-tests
          make -C src -j2 ARCH=x86-64 COMP=mingw atomic-bin-v2-sink-tests
          make -C src -j2 ARCH=x86-64 COMP=mingw atomic-bin-v2-manifest-tests
          make -C src -j2 ARCH=x86-64 COMP=mingw atomic-bin-v2-manifest-reader-tests
          make -C src -j2 ARCH=x86-64 COMP=mingw atomic-bin-v2-reader-tests
          make -C src -j2 ARCH=x86-64 COMP=mingw data-tools-tests
          printf 'atomic_data_schema\natomic_data_schemas\nquit\n' | src/atomic-stockfish-data-generator.exe > schema.txt
          grep -F '"schema_sha256":"acca0f551f1c012c31a6c727dedccaebb7b5ebbc46810edb87e31bb208d5abe1"' schema.txt
          grep -F '"schema_sha256":"0352b036f2a140c609e3eb9c9d635dc553e8d77253d8faa92437390f5cf93cb6"' schema.txt
          rm -f schema.txt
      - name: Functional Windows data-generator smoke (Threads=2)
        run: |
          python tests/create_synthetic_zero_nnue.py --output "$RUNNER_TEMP/atomic-zero.nnue"
          src/atomic-v2-backend-core-tests.exe "$RUNNER_TEMP/atomic-v2.nnue"
          src/atomic-v2-incremental-tests.exe --net "$RUNNER_TEMP/atomic-v2.nnue" --operations 4096 --full-refresh-interval 1
          python tests/data_generator.py --smoke-only \
            --generator src/atomic-stockfish-data-generator.exe \
            --normal-engine src/atomic-stockfish.exe \
            --net "$RUNNER_TEMP/atomic-zero.nnue" \
            --expected-net-sha256 "$ATOMIC_SYNTHETIC_NNUE_SHA256"
      - name: MinGW debug/assert build and protocol smoke
        run: |
          make -C src ARCH=x86-64 COMP=mingw clean
          make -C src -j2 ARCH=x86-64 COMP=mingw debug=yes optimize=no build
          make -C src -j2 ARCH=x86-64 COMP=mingw debug=yes optimize=no atomic-unit-tests
          make -C src -j2 ARCH=x86-64 COMP=mingw debug=yes optimize=no atomic-api-tests
          python tests/release_protocol_smoke.py --engine src/atomic-stockfish.exe

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan and UBSan
            sanitizer: address,undefined
            mode: memory
          - name: TSan
            sanitizer: thread
            mode: thread
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Lower ASLR entropy for TSan
        if: matrix.mode == 'thread'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Build instrumented engine
        working-directory: src
        env:
          CXXFLAGS: -O1
        run: |
          make -j2 ARCH=x86-64-sse41-popcnt sanitize=${{ matrix.sanitizer }} debug=yes optimize=no build
          make -j2 ARCH=x86-64-sse41-popcnt sanitize=${{ matrix.sanitizer }} debug=yes optimize=no atomic-nnue-incremental-tests.bin
          make -j2 ARCH=x86-64-sse41-popcnt sanitize=${{ matrix.sanitizer }} debug=yes optimize=no atomic-v2-backend-core-tests.bin
          make -j2 ARCH=x86-64-sse41-popcnt sanitize=${{ matrix.sanitizer }} debug=yes optimize=no atomic-v2-incremental-tests.bin
          make -j2 ARCH=x86-64-sse41-popcnt sanitize=${{ matrix.sanitizer }} debug=yes optimize=no data-generator
          make -j2 ARCH=x86-64-sse41-popcnt sanitize=${{ matrix.sanitizer }} debug=yes optimize=no data-tools
      - name: Create authenticated Legacy V1 and AtomicNNUEV2 fixtures
        run: |
          python3 tests/create_synthetic_zero_nnue.py --output "$RUNNER_TEMP/atomic-zero.nnue"
          python3 tests/create_synthetic_atomic_v2_nnue.py --output "$RUNNER_TEMP/atomic-v2.nnue"
      - name: Memory-sanitized units
        if: matrix.mode == 'memory'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          CXXFLAGS=-O1 make -C src -j2 ARCH=x86-64-sse41-popcnt sanitize=${{ matrix.sanitizer }} debug=yes optimize=no atomic-unit-tests
          CXXFLAGS=-O1 make -C src -j2 ARCH=x86-64-sse41-popcnt sanitize=${{ matrix.sanitizer }} debug=yes optimize=no atomic-api-tests
          CXXFLAGS=-O1 make -C src -j2 ARCH=x86-64-sse41-popcnt sanitize=${{ matrix.sanitizer }} debug=yes optimize=no legacy-atomic-v1-tests
          CXXFLAGS=-O1 make -C src -j2 ARCH=x86-64-sse41-popcnt sanitize=${{ matrix.sanitizer }} debug=yes optimize=no atomic-bin-v2-tests
          CXXFLAGS=-O1 make -C src -j2 ARCH=x86-64-sse41-popcnt sanitize=${{ matrix.sanitizer }} debug=yes optimize=no atomic-bin-v2-sink-tests
          CXXFLAGS=-O1 make -C src -j2 ARCH=x86-64-sse41-popcnt sanitize=${{ matrix.sanitizer }} debug=yes optimize=no atomic-bin-v2-manifest-tests
          CXXFLAGS=-O1 make -C src -j2 ARCH=x86-64-sse41-popcnt sanitize=${{ matrix.sanitizer }} debug=yes optimize=no atomic-bin-v2-manifest-reader-tests
          CXXFLAGS=-O1 make -C src -j2 ARCH=x86-64-sse41-popcnt sanitize=${{ matrix.sanitizer }} debug=yes optimize=no atomic-bin-v2-reader-tests
          CXXFLAGS=-O1 make -C src -j2 ARCH=x86-64-sse41-popcnt sanitize=${{ matrix.sanitizer }} debug=yes optimize=no data-tools-tests
          ATOMIC_PERFT_NET="$RUNNER_TEMP/atomic-v2.nnue" bash tests/perft.sh src/atomic-stockfish
      - name: Instrumented AtomicNNUEV2 core, incremental, reload and threading
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1:log_path=tsan-v2
        run: |
          operations=1024
          if [ "${{ matrix.mode }}" = memory ]; then operations=4096; fi
          set +e
          src/atomic-v2-backend-core-tests.bin "$RUNNER_TEMP/atomic-v2.nnue" && \
          src/atomic-v2-incremental-tests.bin \
            --net "$RUNNER_TEMP/atomic-v2.nnue" \
            --operations "$operations" \
            --full-refresh-interval 1 && \
          python3 tests/nnue_v2_modes.py \
            --engine src/atomic-stockfish \
            --legacy-net "$RUNNER_TEMP/atomic-zero.nnue" \
            --legacy-sha256 "$ATOMIC_SYNTHETIC_NNUE_SHA256" \
            --v2-net "$RUNNER_TEMP/atomic-v2.nnue" \
            --timeout 180
          status=$?
          if compgen -G 'tsan-v2.*' > /dev/null; then
            cat tsan-v2.*
          fi
          exit "$status"
      - name: Instrumented data-generator smoke (Threads=2)
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1:log_path=tsan-generator
        run: |
          set +e
          python3 tests/data_generator.py --smoke-only \
            --generator src/atomic-stockfish-data-generator \
            --normal-engine src/atomic-stockfish \
            --net "$RUNNER_TEMP/atomic-zero.nnue" \
            --expected-net-sha256 "$ATOMIC_SYNTHETIC_NNUE_SHA256"
          status=$?
          if compgen -G 'tsan-generator.*' > /dev/null; then
            cat tsan-generator.*
          fi
          exit "$status"
      - name: Instrumented XBoard workload
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1:log_path=tsan-report
        run: |
          set +e
          python3 tests/xboard_protocol.py \
            --candidate src/atomic-stockfish \
            --eval-file "$RUNNER_TEMP/atomic-v2.nnue" \
            --timeout 180
          status=$?
          if compgen -G 'tsan-report.*' > /dev/null; then
            cat tsan-report.*
          fi
          exit "$status"

  nnue-v2-valgrind:
    name: AtomicNNUE V2 Valgrind
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends valgrind
      - name: Build AtomicNNUEV2 isolated tests
        working-directory: src
        run: |
          make -j2 ARCH=x86-64 COMP=gcc COMPCXX=g++ \
            debug=yes optimize=no atomic-v2-backend-core-tests.bin
          make -j2 ARCH=x86-64 COMP=gcc COMPCXX=g++ \
            debug=yes optimize=no atomic-v2-incremental-tests.bin
      - name: Run AtomicNNUEV2 isolated tests under Valgrind
        run: |
          python3 tests/create_synthetic_atomic_v2_nnue.py \
            --output "$RUNNER_TEMP/atomic-v2.nnue"
          valgrind \
            --error-exitcode=99 \
            --leak-check=full \
            --show-leak-kinds=all \
            --errors-for-leak-kinds=all \
            --track-origins=yes \
            --num-callers=30 \
            src/atomic-v2-backend-core-tests.bin \
            "$RUNNER_TEMP/atomic-v2.nnue"
          valgrind \
            --error-exitcode=99 \
            --leak-check=full \
            --show-leak-kinds=all \
            --errors-for-leak-kinds=all \
            --track-origins=yes \
            --num-callers=30 \
            src/atomic-v2-incremental-tests.bin \
            --net "$RUNNER_TEMP/atomic-v2.nnue" \
            --operations 256 \
            --full-refresh-interval 1

  atomic-bin-v2-valgrind:
    name: Atomic BIN V2 Valgrind
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends valgrind
      - name: Build isolated Atomic BIN V2 tests
        working-directory: src
        run: |
          make -j2 ARCH=x86-64 COMP=gcc COMPCXX=g++ \
            debug=yes optimize=no atomic-bin-v2-tests.bin
          make -j2 ARCH=x86-64 COMP=gcc COMPCXX=g++ \
            debug=yes optimize=no atomic-bin-v2-sink-tests.bin
          make -j2 ARCH=x86-64 COMP=gcc COMPCXX=g++ \
            debug=yes optimize=no atomic-bin-v2-manifest-tests.bin
          make -j2 ARCH=x86-64 COMP=gcc COMPCXX=g++ \
            debug=yes optimize=no atomic-bin-v2-manifest-reader-tests.bin
          make -j2 ARCH=x86-64 COMP=gcc COMPCXX=g++ \
            debug=yes optimize=no atomic-bin-v2-reader-tests.bin
      - name: Run Atomic BIN V2 tests under Valgrind
        run: |
          for test in atomic-bin-v2-tests atomic-bin-v2-sink-tests atomic-bin-v2-manifest-tests atomic-bin-v2-manifest-reader-tests atomic-bin-v2-reader-tests; do
            valgrind \
              --error-exitcode=99 \
              --leak-check=full \
              --show-leak-kinds=all \
              --errors-for-leak-kinds=all \
              --track-origins=yes \
              --num-callers=30 \
              "src/${test}.bin"
          done
      - name: Build optimized real generator
        working-directory: src
        run: |
          make objclean
          make -j2 ARCH=x86-64 COMP=gcc COMPCXX=g++ data-generator
      - name: Run a real Atomic BIN V2 generator under Valgrind
        run: |
          python3 tests/create_synthetic_zero_nnue.py --output "$RUNNER_TEMP/atomic-zero.nnue"
          python3 tests/atomic_bin_v2_valgrind.py \
            --generator src/atomic-stockfish-data-generator \
            --net "$RUNNER_TEMP/atomic-zero.nnue" \
            --expected-net-sha256 "$ATOMIC_SYNTHETIC_NNUE_SHA256"

  python:
    name: Python stable ABI (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check -r tests/python-ci-requirements.txt
      - run: python setup.py build_ext --inplace
      - run: python test.py
      - run: python -m pytest -q tests/python/test_pyffish.py
      - run: >-
          python -m pytest -q
          tests/python/test_atomic_los_gate.py
          tests/python/test_atomic_syzygy_uci.py
          tests/python/test_atomic_compiler_preflight.py
          tests/python/test_atomic_debug_ci_contract.py
          tests/python/test_default_net_contract.py
          tests/python/test_atomic_training_data_schema.py
          tests/python/test_atomic_bin_v2_schema.py
          tests/python/test_atomic_bin_v2_manifest_schema.py
          tests/python/test_atomic_data_tools_source_lists.py
          tests/python/test_atomic_init_source_lists.py
          tests/python/test_atomic_nnue_differential.py
          tests/python/test_atomic_nnue_incremental_wrapper.py
          tests/python/test_atomic_nnue_v2_contract.py
          tests/python/test_create_synthetic_atomic_v2_nnue.py
          tests/python/test_atomic_v2_generator_smoke.py
          tests/python/test_nnue_dispatcher_source.py
          tests/python/test_legacy_pipeline_lock.py
          tests/python/test_legacy_pipeline_build_manifest.py
          tests/python/test_data_generator_build_manifest.py
          tests/python/test_legacy_pipeline_e2e.py
          tests/python/test_atomic_bin_v2_pipeline_e2e.py
          tests/python/test_atomic_capture_prefilter_source.py
          tests/python/test_openbench_build_contract.py
          tests/python/test_openbench_datagen_bundle.py
          tests/python/test_authenticated_datagen_bundle_v2.py
          tests/python/test_release_version.py
          tests/python/test_wasm_source_date_epoch.py
      - run: python setup.py sdist --dist-dir dist/sdist
      - run: python tests/python/build_wheel_from_sdist.py dist/sdist dist/wheel
      - run: python tests/python/test_wheel_layout.py dist/wheel

  board-wasm:
    name: CommonJS and ES-module WASM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build Board WASM
        run: >-
          docker run --rm
          --volume "$PWD:/src"
          --workdir /src/src
          emscripten/emsdk:4.0.10@sha256:90b757eb11fa9a0e3ce4d2d9f76d932a56018e4accc37b5a28b2783751e60eb7
          make -f Makefile_js all
      - name: Test CommonJS and ES modules
        working-directory: tests/js
        run: npm test

  nnue-wasm:
    name: Node UCI dual-backend NNUE WASM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build complete pthread NNUE WASM
        run: >-
          docker run --rm
          --volume "$PWD:/src"
          --workdir /src
          emscripten/emsdk:4.0.10@sha256:90b757eb11fa9a0e3ce4d2d9f76d932a56018e4accc37b5a28b2783751e60eb7
          python3 tests/wasm-engine/build.py
          --out-dir build/wasm-engine-ci
      - name: Create authenticated V1 and V2 fixtures
        run: |
          python3 tests/create_synthetic_zero_nnue.py --output "$RUNNER_TEMP/atomic-zero.nnue"
          python3 tests/create_synthetic_atomic_v2_nnue.py --output "$RUNNER_TEMP/atomic-v2.nnue"
      - name: Full Legacy V1 UCI, perft and interactive pthread gate
        run: |
          node tests/wasm-engine/run-engine-tests.mjs \
            --engine build/wasm-engine-ci/atomic-stockfish-nnue-node.mjs \
            --net "$RUNNER_TEMP/atomic-zero.nnue" \
            --expected-net-sha256 "$ATOMIC_SYNTHETIC_NNUE_SHA256"
      - name: Dual-backend reload, export, rollback and memory gate
        run: |
          node tests/wasm-engine/run-dual-backend-tests.mjs \
            --engine build/wasm-engine-ci/atomic-stockfish-nnue-node.mjs \
            --legacy-net "$RUNNER_TEMP/atomic-zero.nnue" \
            --legacy-sha256 "$ATOMIC_SYNTHETIC_NNUE_SHA256" \
            --v2-net "$RUNNER_TEMP/atomic-v2.nnue" \
            --v2-sha256 "$ATOMIC_SYNTHETIC_V2_NNUE_SHA256"

  browser-wasm:
    name: Browser Web Worker NNUE WASM
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build the browser-worker target
        run: >-
          docker run --rm
          --volume "$PWD:/src"
          --workdir /src
          emscripten/emsdk:4.0.10@sha256:90b757eb11fa9a0e3ce4d2d9f76d932a56018e4accc37b5a28b2783751e60eb7
          python3 tests/wasm-browser/build.py
          --out-dir build/wasm-browser-ci
      - name: Install Playwright, its browsers and the rules oracle
        working-directory: tests/wasm-browser
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox
          python -m pip install -r requirements.txt
      - name: Browser lifecycle tests in Chromium and Firefox
        run: |
          python tests/create_synthetic_zero_nnue.py --output "$RUNNER_TEMP/atomic-zero.nnue"
          node tests/wasm-browser/run-browser-tests.mjs \
            --engine build/wasm-browser-ci \
            --net "$RUNNER_TEMP/atomic-zero.nnue" \
            --net-sha256 "$ATOMIC_SYNTHETIC_NNUE_SHA256" \
            --fixtures "$RUNNER_TEMP/wasm-browser-fixtures" \
            --python python

  legacy-pipeline:
    name: Pinned Legacy Atomic V1 pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Atomic-Stockfish
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10.18'
      - name: Resolve immutable sibling pins
        id: pipeline_lock
        run: >-
          python tests/legacy_pipeline_lock.py
          github-outputs --output "$GITHUB_OUTPUT"
          --allow-unresolved-hashes
      - name: Check out variant-nnue-tools at the locked commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ steps.pipeline_lock.outputs.tools_repository }}
          ref: ${{ steps.pipeline_lock.outputs.tools_commit }}
          path: .pipeline/tools
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - name: Fetch the tools engine authentication ref
        working-directory: .pipeline/tools/engine/Atomic-Stockfish
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin
          fi
          git fetch --no-tags origin +main:refs/remotes/origin/main
      - name: Check out variant-nnue-pytorch at the locked commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ steps.pipeline_lock.outputs.trainer_repository }}
          ref: ${{ steps.pipeline_lock.outputs.trainer_commit }}
          path: .pipeline/trainer
          persist-credentials: false
          submodules: recursive
      - name: Fetch the trainer engine authentication ref
        working-directory: .pipeline/trainer/external/Atomic-Stockfish
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin
          fi
          git fetch --no-tags origin +main:refs/remotes/origin/main
      - name: Install pinned CPU trainer dependencies
        run: |
          echo "1298F53B58B86B543F79AF4BB262838FE03B82F70D7892C7A5DDADBC0B008224  tests/pip-bootstrap-requirements.txt" | sha256sum --check --strict
          python -m pip install --disable-pip-version-check --require-hashes -r tests/pip-bootstrap-requirements.txt
          echo "20E818B72736FC95CEDF82FDE26413B8ABCC036809BAD72E25AAD93D327FCDA7  tests/legacy_pipeline-ci-requirements.txt" | sha256sum --check --strict
          python -m pip install --disable-pip-version-check --require-hashes -r tests/legacy_pipeline-ci-requirements.txt
      - name: Record pipeline toolchain provenance
        run: |
          python --version
          python -m pip --version
          python -m pip freeze --all
          cmake --version
          g++ --version
          make --version
      - name: Clean-build and test variant-nnue-tools
        run: |
          python tests/legacy_pipeline_build_manifest.py \
            --recipe synthetic-ci-tools-linux-v2 \
            --repository-root .pipeline/tools \
            --output "$RUNNER_TEMP/tools-build.json"
          make -C .pipeline/tools pin-tests verify-delegated-tsan tools-unit
          make -C .pipeline/tools -j2 ARCH=x86-64 COMP=gcc v2-data-tools
          python .pipeline/tools/tests/tools_integration.py --engine .pipeline/tools/src/atomic-data-tools
      - name: Clean-build trainer native loader
        run: |
          python tests/legacy_pipeline_build_manifest.py \
            --recipe synthetic-ci-trainer-linux-v1 \
            --repository-root .pipeline/trainer \
            --output "$RUNNER_TEMP/trainer-build.json"
          ctest --test-dir .pipeline/trainer/build/pipeline-manifest-release -C Release --output-on-failure
      - name: Test trainer CPU surface
        working-directory: .pipeline/trainer
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m pytest -q -p no:cacheprovider
      - name: Clean-build and test Atomic-Stockfish
        run: |
          python tests/legacy_pipeline_build_manifest.py \
            --recipe synthetic-ci-atomic-linux-v2 \
            --repository-root . \
            --output "$RUNNER_TEMP/atomic-build.json"
          python tests/legacy_pipeline_build_manifest.py \
            --recipe synthetic-ci-atomic-data-generator-linux-v2 \
            --repository-root . \
            --output "$RUNNER_TEMP/atomic-data-generator-build.json"
          make -C src -j2 ARCH=x86-64 atomic-unit-tests
          make -C src -j2 ARCH=x86-64 atomic-api-tests
          make -C src -j2 ARCH=x86-64 legacy-atomic-v1-tests
          make -C src -j2 ARCH=x86-64 atomic-bin-v2-tests
          make -C src -j2 ARCH=x86-64 atomic-bin-v2-sink-tests
          make -C src -j2 ARCH=x86-64 atomic-bin-v2-manifest-tests
          make -C src -j2 ARCH=x86-64 atomic-bin-v2-manifest-reader-tests
          make -C src -j2 ARCH=x86-64 atomic-bin-v2-reader-tests
          make -C src -j2 ARCH=x86-64 data-tools
          bash tests/perft.sh src/atomic-stockfish
          python tests/atomic_search.py --candidate src/atomic-stockfish
      - name: Enforce locked clean checkouts
        run: >-
          python tests/legacy_pipeline_lock.py verify-checkouts
          --tools-root .pipeline/tools
          --trainer-root .pipeline/trainer
          --atomic-root .
          --tools-engine .pipeline/tools/src/atomic-data-tools
          --engine src/atomic-stockfish
          --atomic-commit "$(git rev-parse HEAD)"
          --allow-unresolved-hashes
      - name: Measure unresolved synthetic pipeline fixture
        if: steps.pipeline_lock.outputs.synthetic_hashes_resolved == 'false'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python tests/legacy_pipeline_e2e.py \
            --profile synthetic-ci \
            --tools-engine .pipeline/tools/src/atomic-data-tools \
            --trainer-root .pipeline/trainer \
            --engine src/atomic-stockfish-pipeline \
            --atomic-data-generator src/atomic-stockfish-data-generator-pipeline \
            --tools-build-manifest "$RUNNER_TEMP/tools-build.json" \
            --trainer-build-manifest "$RUNNER_TEMP/trainer-build.json" \
            --atomic-build-manifest "$RUNNER_TEMP/atomic-build.json" \
            --atomic-data-generator-build-manifest "$RUNNER_TEMP/atomic-data-generator-build.json" \
            --atomic-root . \
            --atomic-commit "$(git rev-parse HEAD)" \
            --measure-synthetic-fixture
          echo "::error title=Synthetic fixture lock update required::Copy the measured source_sha256 and Atomic-owned data_sha256 into tests/legacy_pipeline.lock.json, set hashes_resolved=true, and remove its placeholder."
          exit 1
      - name: Synthetic Legacy Atomic V1 E2E
        if: steps.pipeline_lock.outputs.synthetic_hashes_resolved == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python tests/legacy_pipeline_e2e.py
          --profile synthetic-ci
          --tools-engine .pipeline/tools/src/atomic-data-tools
          --trainer-root .pipeline/trainer
          --engine src/atomic-stockfish-pipeline
          --atomic-data-generator src/atomic-stockfish-data-generator-pipeline
          --tools-build-manifest "$RUNNER_TEMP/tools-build.json"
          --trainer-build-manifest "$RUNNER_TEMP/trainer-build.json"
          --atomic-build-manifest "$RUNNER_TEMP/atomic-build.json"
          --atomic-data-generator-build-manifest "$RUNNER_TEMP/atomic-data-generator-build.json"
          --atomic-root .
          --atomic-commit "$(git rev-parse HEAD)"
      - name: Synthetic Atomic BIN V2 generate-train-load E2E
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          SOURCE_NET="$RUNNER_TEMP/atomic-h7-zero.nnue"
          OUTPUT_DIR="$RUNNER_TEMP/atomic-h7-v2-e2e"
          PYTHON_BIN="$(python -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve())')"
          test ! -e "$SOURCE_NET"
          test ! -e "$OUTPUT_DIR"
          python -B tests/create_synthetic_zero_nnue.py --output "$SOURCE_NET"
          echo "9CF054CA00B82AB53A34473DE52D1104AEDDAA19B2E7B24091B5E613AF485985  $SOURCE_NET" | sha256sum --check --strict

          sha256_file() {
            sha256sum "$1" | awk '{print tolower($1)}'
          }

          python -B tests/atomic_bin_v2_pipeline_e2e.py \
            --profile synthetic-ci \
            --atomic-root . \
            --atomic-commit "$(git rev-parse HEAD)" \
            --atomic-ref "$(git rev-parse HEAD)" \
            --tools-root .pipeline/tools \
            --tools-commit 450049ee7a0ece32694b11f6c55deb7df1d42a84 \
            --tools-ref 450049ee7a0ece32694b11f6c55deb7df1d42a84 \
            --trainer-root .pipeline/trainer \
            --trainer-commit 3a19c16fc3d477b1ee7602ccc6510736bc7604cc \
            --trainer-ref 3a19c16fc3d477b1ee7602ccc6510736bc7604cc \
            --tools-engine-commit 420c9f35266fbdc2167dc5b9d8d20d90281c60c9 \
            --trainer-engine-commit 420c9f35266fbdc2167dc5b9d8d20d90281c60c9 \
            --engine src/atomic-stockfish-pipeline \
            --engine-sha256 "$(sha256_file src/atomic-stockfish-pipeline)" \
            --data-generator src/atomic-stockfish-data-generator-pipeline \
            --data-generator-sha256 "$(sha256_file src/atomic-stockfish-data-generator-pipeline)" \
            --data-tools src/atomic-stockfish-data-tools \
            --data-tools-sha256 "$(sha256_file src/atomic-stockfish-data-tools)" \
            --tools-wrapper .pipeline/tools/script/atomic_bin_v2_tools.py \
            --wrapper-data-tools .pipeline/tools/engine/Atomic-Stockfish/src/atomic-stockfish-data-tools \
            --wrapper-data-tools-sha256 "$(sha256_file .pipeline/tools/engine/Atomic-Stockfish/src/atomic-stockfish-data-tools)" \
            --trainer-loader .pipeline/trainer/libtraining_data_loader.so \
            --trainer-loader-sha256 "$(sha256_file .pipeline/trainer/libtraining_data_loader.so)" \
            --train-script .pipeline/trainer/train.py \
            --serialize-script .pipeline/trainer/serialize.py \
            --python "$PYTHON_BIN" \
            --python-sha256 "$(sha256_file "$PYTHON_BIN")" \
            --source-net "$SOURCE_NET" \
            --source-net-sha256 9cf054ca00b82ab53a34473de52d1104aeddaa19b2e7b24091b5e613af485985 \
            --output-dir "$OUTPUT_DIR" \
            --train-seed 2026071301 \
            --validation-seed 2026071302
      - name: Preserve sanitized Atomic BIN V2 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atomic-bin-v2-e2e-evidence
          path: ${{ runner.temp }}/atomic-h7-v2-e2e
          if-no-files-found: warn
          retention-days: 14
