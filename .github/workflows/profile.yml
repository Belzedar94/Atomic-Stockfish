name: CPU profile of the AtomicDB worker engine (clang 23 PGO, perf)

# Profiles main 722b4735 built as the published Linux AtomicDB worker engine is
# built (ci/worker-engine-pgo-1028): make profile-build ARCH=x86-64-avx2
# COMP=clang CXX=clang++-23 RTLIB=compiler-rt, with the default network
# (atomic_run3b_e202_l05.nnue, Legacy Atomic V1) embedded. Three builds:
#   atomic-pgo     the recipe;
#   atomic-pgo-g   the recipe + -g (debug info only), compared instruction by
#                  instruction with the recipe; sampled without call graphs, it
#                  gives the self time of every source function, inlined ones
#                  included;
#   atomic-pgo-fp  the recipe + -g + frame pointers, sampled with call graphs
#                  (perf --call-graph fp), for the accumulated shares only.
# (Run 41386203994 showed that perf's DWARF unwinding gets no frame at all on the
# search threads of this engine, hence the frame-pointer twin.) All three must give
# bench 433197 and the same worker-like session.
#
# The load (ci/atomicdb_load.py, seeds in ci/profile_seeds.tsv) is shaped like
# AtomicDB tasks: go nodes 3M per position, Hash 256, no ucinewgame anywhere, and
# each seed followed by the positions after its best moves (related positions in a
# row). 24 open positions and 16 decided ones from the mate battery. Three passes:
# MultiPV 1 and MultiPV 5 with one thread, and a short MultiPV 5 pass with four
# threads. ci/perf_attr.py attributes the samples to source functions.
#
# This branch holds no engine source and nothing is published: everything is an
# artifact. Report only, no patch.

on:
  push:
    branches:
      - ci/profile-1102
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-1102
  cancel-in-progress: true

env:
  ENGINE_SHA: 722b47357803895e9f47b30caec381087dcf4a44
  TREE: 98e9d440009fc25b917f11ece03bb30e65591e43
  ATOMIC_NET_TAG: v1.0
  ATOMIC_NET_ASSET: atomic-run3b.nnue
  ATOMIC_NET_SHA256: 99dc67eabf26a64faeeca3a88b4c38597a840b8d4a874b9f2cf658c6f92a04a6
  NET_NAME: atomic_run3b_e202_l05.nnue
  V1_BACKEND: Legacy Atomic V1
  EXPECT_BENCH: "433197"
  LLVM_VERSION: "23"
  NODES: "3000000"
  WALK: "3"
  SELF_FREQ: "999"
  INCL_FREQ: "299"
  T4_SEEDS: "open01,open02,open03,open04,open05,open06,open07,open08,W5#9p,L6-7#12p,W8-10#15p,H11-15#29p"

jobs:
  profile:
    name: perf profile, linux x86-64-avx2 (clang 23, profile-build)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.ENGINE_SHA }}
          path: engine
          persist-credentials: false

      - name: The engine tree is main 722b4735
        run: test "$(git -C engine rev-parse 'HEAD^{tree}')" = "$TREE"

      - name: Install clang ${{ env.LLVM_VERSION }} (apt.llvm.org) and perf
        run: |
          mkdir -p out bins run
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/llvm.sh" https://apt.llvm.org/llvm.sh
          sudo bash "$RUNNER_TEMP/llvm.sh" "$LLVM_VERSION" > out/llvm-install.log 2>&1 || { tail -n 40 out/llvm-install.log; exit 1; }
          sudo apt-get install -y "llvm-$LLVM_VERSION" >> out/llvm-install.log 2>&1 || { tail -n 40 out/llvm-install.log; exit 1; }
          k=$(uname -r)
          sudo apt-get install -y "linux-tools-$k" linux-tools-common > out/perf-install.log 2>&1 \
            || sudo apt-get install -y linux-tools-azure linux-tools-common >> out/perf-install.log 2>&1 \
            || sudo apt-get install -y linux-tools-generic linux-tools-common >> out/perf-install.log 2>&1 \
            || { tail -n 30 out/perf-install.log; echo "::warning::no perf package installed"; }
          ls -d /usr/lib/linux-tools/*/ 2>/dev/null || true

      - name: Toolchain and host
        run: |
          "clang++-$LLVM_VERSION" --version | head -n 1
          "llvm-symbolizer-$LLVM_VERSION" --version | head -n 2
          uname -a
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|MHz|L1d|L2|L3'
          grep -E 'MemTotal|MemAvailable' /proc/meminfo
          df -h . | tail -n 1
          git -C engine log -1 --format='engine: %H %s'

      - name: Network
        run: |
          curl -sSfL --retry 3 -o "engine/src/$NET_NAME" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$ATOMIC_NET_TAG/$ATOMIC_NET_ASSET"
          echo "$ATOMIC_NET_SHA256  engine/src/$NET_NAME" | sha256sum -c -

      # The recipe of the published Linux worker engine, plus the embedding flag, which
      # the clang PGO recipe only reads from the environment (ENV_CXXFLAGS).
      - name: Profile-guided builds (recipe; + -g; + -g and frame pointers)
        working-directory: engine/src
        run: |
          set -eo pipefail
          for v in "atomic-pgo:" "atomic-pgo-g:-g" "atomic-pgo-fp:-g -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer"; do
            exe=${v%%:*}; extra=${v#*:}
            rc=0
            CXXFLAGS="-DATOMIC_NNUE_EMBEDDING $extra" make -j4 profile-build ARCH=x86-64-avx2 COMP=clang \
              CXX="clang++-$LLVM_VERSION" RTLIB=compiler-rt EXE="$exe" > "../../out/build-$exe.log" 2>&1 || rc=$?
            grep -E "^Step|Nodes searched|Nodes/second|WARNING|llvm-profdata merge" "../../out/build-$exe.log" || true
            if [ "$rc" -ne 0 ]; then tail -n 60 "../../out/build-$exe.log"; exit "$rc"; fi
            if grep -q "WARNING: the profiling run found no NNUE network" "../../out/build-$exe.log"; then
              echo "::error::$exe: the profiling run had no network"; exit 1
            fi
            grep -q "Nodes searched  : $EXPECT_BENCH" "../../out/build-$exe.log"
            grep -q "/usr/lib/llvm-$LLVM_VERSION/bin/llvm-profdata merge" "../../out/build-$exe.log"
            readelf -p .comment "$exe" | grep -q "clang version $LLVM_VERSION\."
            test "$(wc -c < "$exe")" -gt "$(wc -c < "$NET_NAME")"
            cp "$exe" ../../bins/
            make objclean profileclean > /dev/null 2>&1 || true
          done
          ls -l ../../bins

      # Byte for byte first; then instruction by instruction with every address and
      # displacement blanked out, which is what decides whether the -g binary runs the
      # recipe's code.
      - name: Machine code of the -g build against the recipe
        run: |
          set +e
          for b in atomic-pgo atomic-pgo-g atomic-pgo-fp; do
            "llvm-objcopy-$LLVM_VERSION" -O binary --only-section=.text "bins/$b" "out/$b.text"
            "llvm-objdump-$LLVM_VERSION" -d --no-show-raw-insn --no-leading-addr -M intel --section=.text "bins/$b" \
              | sed -E 's/0x[0-9a-f]+//g; s/<[^>]*>//g; s/[0-9a-f]{6,}//g' | grep -vE '^\s*$|file format|Disassembly of' > "out/$b.dis"
            wc -l < "out/$b.dis"
          done
          {
            sha256sum out/atomic-pgo.text out/atomic-pgo-g.text out/atomic-pgo-fp.text
            cmp -s out/atomic-pgo.text out/atomic-pgo-g.text && echo "recipe vs -g: IDENTICAL bytes" || echo "recipe vs -g: different bytes"
            if cmp -s out/atomic-pgo.dis out/atomic-pgo-g.dis; then
              echo "recipe vs -g: IDENTICAL instructions (addresses and displacements aside)"
            else
              echo "recipe vs -g: $(diff out/atomic-pgo.dis out/atomic-pgo-g.dis | grep -c '^[<>]') differing instruction lines of $(wc -l < out/atomic-pgo.dis)"
              diff out/atomic-pgo.dis out/atomic-pgo-g.dis > out/dis-diff.txt
              head -n 40 out/dis-diff.txt
            fi
            echo "recipe vs fp: $(diff out/atomic-pgo.dis out/atomic-pgo-fp.dis | grep -c '^[<>]') differing instruction lines"
            for b in atomic-pgo atomic-pgo-g atomic-pgo-fp; do readelf -SW "bins/$b" | grep -E ' \.(text|rodata|data|bss) ' | sed "s|^|$b |"; done
          } | tee out/text-identity.txt
          rm -f out/*.text out/*.dis
          exit 0

      - name: Identity of the three builds (bench, worker-like session)
        run: |
          set -eo pipefail
          test -z "$(ls run/*.nnue 2>/dev/null)"
          python3 ci/engine_check.py --title "linux x86-64-avx2 clang $LLVM_VERSION PGO: recipe, + -g, + -g + frame pointers" \
            --net v1 --bin pgo=bins/atomic-pgo --bin pgo-g=bins/atomic-pgo-g --bin pgo-fp=bins/atomic-pgo-fp --cwd run \
            --expect-backend "$V1_BACKEND" --expect-bench "$EXPECT_BENCH" --rounds 0 \
            --json out/identity.json --md "$GITHUB_STEP_SUMMARY" | tee out/identity.log

      - name: perf setup
        id: perf
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 kernel.perf_event_mlock_kb=262144 \
            kernel.perf_event_max_stack=512
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -n 1)
          if [ -z "$PERF" ] || ! "$PERF" version; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::warning::perf is not usable"; exit 0
          fi
          echo "PERF=$PERF" >> "$GITHUB_ENV"
          if "$PERF" record -e cpu-clock:u -F "$INCL_FREQ" --call-graph fp -o "$RUNNER_TEMP/t.data" -- bins/atomic-pgo-fp bench > /dev/null 2> out/perf-record-check.txt; then
            "$PERF" script -i "$RUNNER_TEMP/t.data" --no-inline -F comm,tid,ip,sym,dso | head -n 60 > out/perf-fp-check.txt || true
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            cat out/perf-record-check.txt; echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::warning::perf record failed"
          fi

      # Self time: the -g twin of the recipe, sampled without call graphs.
      - name: "Self time: MultiPV 1, MultiPV 5 (one thread), MultiPV 5 (four threads)"
        if: steps.perf.outputs.ok == 'true'
        run: |
          set -eo pipefail
          rec="$PERF record -e cpu-clock:u -F $SELF_FREQ"
          python3 ci/atomicdb_load.py --engine bins/atomic-pgo-g --seeds ci/profile_seeds.tsv --cwd run \
            --nodes "$NODES" --multipv 1 --walk "$WALK" --out out/load-self-mpv1.jsonl \
            --wrap "$rec -o $RUNNER_TEMP/self-mpv1.data --" | tee out/load-self-mpv1.log | tail -n 1
          python3 ci/atomicdb_load.py --engine bins/atomic-pgo-g --seeds ci/profile_seeds.tsv --cwd run \
            --nodes "$NODES" --multipv 5 --walk "$WALK" --out out/load-self-mpv5.jsonl \
            --wrap "$rec -o $RUNNER_TEMP/self-mpv5.data --" | tee out/load-self-mpv5.log | tail -n 1
          python3 ci/atomicdb_load.py --engine bins/atomic-pgo-g --seeds ci/profile_seeds.tsv --cwd run \
            --nodes 8000000 --multipv 5 --walk 2 --threads 4 --select "$T4_SEEDS" --out out/load-self-t4.jsonl \
            --wrap "$rec -o $RUNNER_TEMP/self-t4.data --" | tee out/load-self-t4.log | tail -n 1

      # Accumulated shares: the frame-pointer twin, sampled with call graphs.
      - name: "Call graphs: MultiPV 1, MultiPV 5 (one thread), MultiPV 5 (four threads)"
        if: steps.perf.outputs.ok == 'true'
        run: |
          set -eo pipefail
          rec="$PERF record -e cpu-clock:u -F $INCL_FREQ --call-graph fp"
          python3 ci/atomicdb_load.py --engine bins/atomic-pgo-fp --seeds ci/profile_seeds.tsv --cwd run \
            --nodes "$NODES" --multipv 1 --walk "$WALK" --out out/load-fp-mpv1.jsonl \
            --wrap "$rec -o $RUNNER_TEMP/fp-mpv1.data --" | tee out/load-fp-mpv1.log | tail -n 1
          python3 ci/atomicdb_load.py --engine bins/atomic-pgo-fp --seeds ci/profile_seeds.tsv --cwd run \
            --nodes "$NODES" --multipv 5 --walk "$WALK" --out out/load-fp-mpv5.jsonl \
            --wrap "$rec -o $RUNNER_TEMP/fp-mpv5.data --" | tee out/load-fp-mpv5.log | tail -n 1
          python3 ci/atomicdb_load.py --engine bins/atomic-pgo-fp --seeds ci/profile_seeds.tsv --cwd run \
            --nodes 8000000 --multipv 5 --walk 2 --threads 4 --select "$T4_SEEDS" --out out/load-fp-t4.jsonl \
            --wrap "$rec -o $RUNNER_TEMP/fp-t4.data --" | tee out/load-fp-t4.log | tail -n 1

      - name: Attribution
        if: steps.perf.outputs.ok == 'true'
        run: |
          set -eo pipefail
          for kind in self fp; do
            bin=bins/atomic-pgo-g; [ "$kind" = fp ] && bin=bins/atomic-pgo-fp
            for p in mpv1 mpv5 t4; do
              d="$RUNNER_TEMP/$kind-$p.data"
              "$PERF" report -i "$d" --no-children --no-inline -g none --sort sym --stdio --percent-limit 0.2 > "out/report-flat-$kind-$p.txt" 2> /dev/null || true
              "$PERF" script -i "$d" --no-inline --max-stack 64 -F comm,tid,ip,sym,dso --show-mmap-events > "$RUNNER_TEMP/$kind-$p.script" 2> "out/script-$kind-$p.err" || true
              python3 ci/perf_attr.py --script "$RUNNER_TEMP/$kind-$p.script" --binary "$bin" \
                --symbolizer "llvm-symbolizer-$LLVM_VERSION" --title "$kind $p (cpu-clock)" \
                --json "out/attr-$kind-$p.json" --md out/attr.md > "out/attr-$kind-$p.log" 2>&1 || { tail -n 30 "out/attr-$kind-$p.log"; }
              gzip -c "$RUNNER_TEMP/$kind-$p.script" > "out/perf-$kind-$p.script.gz"
              rm -f "$RUNNER_TEMP/$kind-$p.script" "$d"
            done
          done
          cat out/attr.md >> "$GITHUB_STEP_SUMMARY" || true
          ls -l out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: profile-linux
          path: |
            out/
            bins/atomic-pgo-g
            bins/atomic-pgo-fp
          retention-days: 30
          compression-level: 6
