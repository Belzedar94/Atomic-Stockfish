name: Atomic binaries

# Every merge to main leaves downloadable binaries: one artifact per build and
# a rolling prerelease that is overwritten on each push. Separate from
# atomic.yml (the correctness gate).

on:
  push:
    branches:
      - main
  # A pull request that touches how the binaries are built builds them too
  # (artifacts only; the rolling prerelease is published from main alone).
  pull_request:
    paths:
      - src/Makefile
      - scripts/check_elf_isa_level.py
      - .github/workflows/atomic_binaries.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atomic-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  # The published network is named in src/Makefile (NNUE_NET_*), next to
  # EvalFileDefaultName in src/evaluate.h; `make net` fetches and verifies it.
  # Tag of the rolling prerelease. Not `latest-main`: that name was published
  # once while the repository had immutable releases enabled, and GitHub keeps
  # such a tag name reserved forever — deleting the release does not free it,
  # every later create fails with "tag_name was used by an immutable release".
  ROLLING_TAG: rolling-main

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # The same for every matrix entry; the release notes name the network.
    outputs:
      net_asset: ${{ steps.net.outputs.asset }}
      net_tag: ${{ steps.net.outputs.tag }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      # Linux builds run on a pinned image, not ubuntu-latest. Ubuntu 26.04
      # (ubuntu-latest since November 2026) builds its glibc for x86-64-v3:
      # its crt1.o/Scrt1.o carry ISA_1_NEEDED = v3, so every binary linked
      # there declares v3 whatever -march says, and glibc refuses it on older
      # CPUs. Its glibc 2.43 symbol versions would also shut out most
      # distributions in use. 24.04 is the image atomic.yml gates on.
      #
      # isa: the x86-64 level each Linux binary must declare (glibc refuses
      # to load a binary that needs more than the CPU has).
      # ldflags: the AVX2 builds say so themselves (-z x86-64-v3), so an
      # older CPU gets the loader's clear error instead of SIGILL mid-search.
      # emulate: a CPU model without AVX that qemu runs the bench on, for the
      # binary meant for such CPUs; the runner itself has AVX2 and would not
      # notice an AVX2 instruction in it.
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x86-64-bmi2
            comp: gcc
            shell: bash
            ext: ""
            isa: --exact v3
            ldflags: -Wl,-z,x86-64-v3
          - runner: ubuntu-24.04
            os: linux
            arch: x86-64-avx2
            comp: gcc
            shell: bash
            ext: ""
            isa: --exact v3
            ldflags: -Wl,-z,x86-64-v3
          - runner: ubuntu-24.04
            os: linux
            arch: x86-64-sse41-popcnt
            comp: gcc
            shell: bash
            ext: ""
            isa: --max v2
            emulate: Nehalem
          - runner: windows-latest
            os: windows
            arch: x86-64-bmi2
            comp: mingw
            shell: msys2 {0}
            ext: ".exe"
          - runner: windows-latest
            os: windows
            arch: x86-64-avx2
            comp: mingw
            shell: msys2 {0}
            ext: ".exe"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The emulated bench compares against the newest `Bench:` line.
          fetch-depth: 100

      - name: Set up MinGW
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: mingw64
          path-type: inherit
          install: mingw-w64-x86_64-gcc make

      - name: Build identity
        shell: bash
        run: |
          echo "SHA8=$(echo "$GITHUB_SHA" | cut -c1-8)" >> "$GITHUB_ENV"
          echo "EXE_NAME=atomic-stockfish-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" >> "$GITHUB_ENV"

      # `make net` downloads the default network into src/ under its canonical
      # EvalFileDefaultName and checks its SHA-256 (NNUE_NET_* in the
      # Makefile). profile-build would fetch it on its own; a step of its own
      # keeps a download failure apart from a build failure. With the file in
      # src/, the build embeds it, so the binary runs with no companion file.
      - name: Fetch and verify the Atomic network
        id: net
        working-directory: src
        run: |
          make net
          canon=$(sed -n 's/.*EvalFileDefaultName[[:space:]]*"\([^"]*\)".*/\1/p' evaluate.h | head -n 1)
          test -n "$canon"
          test -f "$canon"
          tag=$(sed -n 's/^NNUE_NET_TAG[[:space:]]*=[[:space:]]*//p' Makefile)
          test -n "$tag"
          echo "CANON_NET=$canon" >> "$GITHUB_ENV"
          echo "asset=$canon" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # What the compiler targets when given no -march, and the level the
      # system's startup files declare: the Makefile pins -march for every
      # x86-64 ARCH, but crt1.o is linked into every binary, so a runner
      # image built for a higher level shows up here first.
      - name: Toolchain report
        if: runner.os == 'Linux'
        run: |
          g++ --version | head -n 1
          g++ -Q --help=target 2>/dev/null | grep -E '^[[:space:]]+-m(arch|tune)=' || true
          echo | g++ -dM -E -x c++ - | grep -E '__(AVX2|SSE4_2|x86_64)__' | sort || true
          ldd --version | head -n 1
          crt=$(g++ -print-file-name=Scrt1.o)
          echo "$crt: $(readelf -n "$crt" | grep -E 'ISA needed' | sed 's/^[[:space:]]*//' || echo 'no ISA needed note')"

      # Profile-guided. The instrumented build plays the bench with the network
      # fetched above (the engine evaluates with NNUE only), and the final build
      # is optimised for what that run executed. Both embed the network.
      - name: Build
        working-directory: src
        run: |
          set -o pipefail
          log="$(mktemp)"
          LDFLAGS="${{ matrix.ldflags }}" \
            make -j2 profile-build ARCH=${{ matrix.arch }} COMP=${{ matrix.comp }} \
            EXE="$EXE_NAME" 2>&1 | tee "$log"
          # If the profiling bench finds no network, profile-build still exits 0
          # and only warns, and what it leaves profiled nothing of the search, so
          # it is far slower than a plain build. Never publish that one.
          if grep -q "the profiling run found no NNUE network" "$log"; then
            echo "::error::profile-build did not profile the NNUE evaluation"
            exit 1
          fi
          strip "$EXE_NAME"
          # The network is ~45 MiB and the engine itself a couple of MiB, so a
          # binary smaller than the network it is supposed to carry never got
          # the incbin blob, whatever the compiler reported.
          test "$(wc -c < "$EXE_NAME")" -gt "$(wc -c < "$CANON_NET")"

      # Benching inside src/ proves nothing about embedding: the network placed
      # above sits next to the binary, so the engine loads it off disk and the
      # run succeeds either way — which is how a build with no network inside it
      # could ship as one that had. Bench from a directory holding no .nnue at
      # all; then a completed search can only come from the embedded copy.
      #
      # bench reports through stderr and returns 0 even when the search never
      # started, so the node count is the real gate; the verifier line proves
      # the embedded network is the one being evaluated.
      - name: Bench with no network on disk
        working-directory: src
        run: |
          rm -rf ../embedcheck
          mkdir ../embedcheck
          cp "$EXE_NAME" ../embedcheck/
          cd ../embedcheck
          test -z "$(ls *.nnue 2>/dev/null)"
          ./"$EXE_NAME" bench 16 1 8 default depth > bench.log 2>&1
          tail -n 12 bench.log
          grep -q "NNUE evaluation using" bench.log
          nodes=$(grep -oE 'Nodes searched[[:space:]]*:[[:space:]]*[0-9]+' bench.log | grep -oE '[0-9]+$' | tail -n 1)
          test -n "$nodes"
          test "$nodes" -gt 0

      # glibc reads the x86-64 level a binary declares (.note.gnu.property,
      # ISA_1_NEEDED) and refuses to start it on a CPU below that level. The
      # runner has AVX2, so the bench above passes whatever was declared: the
      # sse41-popcnt binary once shipped needing x86-64-v3 and failed to load
      # on every CPU it exists for. Check the declared level, and for the
      # pre-AVX2 binary also that no AVX instruction made it into the code.
      - name: Check the declared x86-64 level
        if: matrix.isa != ''
        working-directory: src
        run: |
          python3 ../scripts/check_elf_isa_level.py "$EXE_NAME" ${{ matrix.isa }}
          echo "Highest glibc symbol version required:" \
            "$(objdump -T "$EXE_NAME" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -n 1)"
          if [ -n "${{ matrix.emulate }}" ]; then
            objdump -d --no-show-raw-insn "$EXE_NAME" > disasm.txt
            avx=$(grep -cE '%[yz]mm|^[[:space:]]*[0-9a-f]+:[[:space:]]+v[a-z0-9]+[[:space:]]+.*%xmm' disasm.txt || true)
            rm -f disasm.txt
            echo "AVX instructions in the code: $avx"
            test "$avx" -eq 0
          fi

      - name: Extract the bench number from the commit history
        if: matrix.emulate != ''
        run: |
          for hash in $(git rev-list -100 HEAD); do
            benchref=$(git show -s $hash | tac | grep -m 1 -o -x '[[:space:]]*\b[Bb]ench[ :]\+[1-9][0-9]\{5,7\}\b[[:space:]]*' | sed 's/[^0-9]//g') && break || true
          done
          test -n "$benchref" || { echo "No Bench: line in the last 100 commits"; exit 1; }
          echo "benchref=$benchref" >> "$GITHUB_ENV"
          echo "Reference bench: $benchref (from $hash)"

      # Run the binary as a CPU without AVX would: qemu's CPU model hides AVX
      # from both the loader's level check and the instruction decoder, so a
      # binary needing more than that CPU has fails here instead of on a user's
      # machine. The signature proves the emulated run searched the same tree.
      - name: Bench signature on an emulated ${{ matrix.emulate }}
        if: matrix.emulate != ''
        working-directory: embedcheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user
          printf '#!/bin/sh\nexec qemu-x86_64 -cpu %s "%s" "$@"\n' \
            "${{ matrix.emulate }}" "$PWD/$EXE_NAME" > emulated
          chmod +x emulated
          EXE="$PWD/emulated" ../tests/signature.sh "$benchref"

      # The embedded network is most of the binary and does not compress, so
      # zipping it only costs upload time.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Atomic-Stockfish-${{ env.SHA8 }}-${{ matrix.os }}-${{ matrix.arch }}
          path: src/${{ env.EXE_NAME }}
          if-no-files-found: error
          compression-level: 0

  rolling-release:
    name: Rolling main prerelease
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Assets are attached before the release is published, never after. A
      # release that is published first and filled in afterwards is visible —
      # and linkable — while still empty, and if the upload then fails the notes
      # keep advertising binaries that are not there.
      - name: Publish the rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          ATOMIC_NET_ASSET: ${{ needs.build.outputs.net_asset }}
          ATOMIC_NET_TAG: ${{ needs.build.outputs.net_tag }}
        run: |
          sha8=$(echo "$GITHUB_SHA" | cut -c1-8)
          built=$(date -u +'%Y-%m-%d %H:%M UTC')
          ls -l dist

          # A rolling tag and immutable releases are mutually exclusive: the
          # first immutable publish reserves the tag name permanently, so the
          # next merge can neither move it nor replace the release. Stop here
          # instead of burning the name.
          immutable=$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled 2>/dev/null || echo unknown)
          if [ "$immutable" = "true" ]; then
            echo "::error::Immutable releases are enabled: $ROLLING_TAG cannot be republished. Disable them for this repository, or move this job to per-commit tags."
            exit 1
          fi

          {
            echo "Binaries built from \`main\`, refreshed on every merge."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | [\`$sha8\`](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) |"
            echo "| Built | $built |"
            echo "| Network | \`$ATOMIC_NET_ASSET\` from [$ATOMIC_NET_TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$ATOMIC_NET_TAG), embedded |"
            echo
            echo "Pick the binary matching your CPU: \`x86-64-bmi2\` for anything from"
            echo "Haswell/Zen 3 onwards, \`x86-64-avx2\` as the safer fallback,"
            echo "and \`x86-64-sse41-popcnt\` (Linux) for older CPUs without AVX2."
            echo
            echo "The network is inside the binary, so no companion file is needed:"
            echo "every build here is benched from a directory with no \`.nnue\` in it."
            echo "Atomic Syzygy tablebases are still optional and external."
          } > notes.md

          # Rebuilt from scratch on every run. An existing release keeps its own
          # tag, so editing it in place would leave the tag pinned at the commit
          # that first created it.
          gh release delete "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$ROLLING_TAG" >/dev/null 2>&1 || true

          gh release create "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --draft \
            --title "Atomic-Stockfish dev ($sha8)" --notes-file notes.md
          gh release upload "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" dist/*
          gh release edit "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease

          # Notes that promise binaries must not outlive the binaries, so the
          # published asset list is the gate, not the exit code of the upload.
          gh release view "$ROLLING_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | sort > published.txt
          (cd dist && ls) | sort > expected.txt
          diff expected.txt published.txt
          echo "Published $(wc -l < published.txt) assets on $ROLLING_TAG."
