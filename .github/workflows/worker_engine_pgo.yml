name: AtomicDB worker engines (PGO)

# Builds the engine the AtomicDB workers download, profile-guided, for the three
# platforms of the worker manifest. Each profile-guided binary must search exactly
# like a plain build of the same commit (same bench signature, same output on a
# worker-like UCI session), and both are timed back to back on the same runner.
# The served binary comes from an older commit, so it is only used to compare
# what the binaries need from the system, not their output.
#
# On Linux the profile-guided binary is built with the newest LLVM release from
# apt.llvm.org (LLVM_VERSION) and checked against the plain GCC build, so its
# identity is checked across compilers. A profile-guided GCC build and a build
# with Ubuntu's own clang are timed next to it, as references only. On Windows
# the binary is built profile-guided with MSYS2's newest clang and checked, on
# one runner, against the profile-guided gcc 15.2.0-8 build, which its own job
# checks against a plain build of the same commit; the gcc builds are references
# only.
#
# The binaries to publish are in the artifacts worker-engine-linux,
# worker-engine-windows and worker-engine-macos, named
# Atomic-Stockfish-<platform>-pgo (.exe on Windows).
#
# The engine source is not on this branch. It is checked out by SHA (ENGINE_SHA,
# a main commit), so changing this workflow never changes what is built.
#
# Nothing is published from here: the binaries are workflow artifacts only.

on:
  push:
    branches:
      - ci/worker-engine-pgo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-engine-pgo-${{ github.ref }}
  cancel-in-progress: true

env:
  ENGINE_SHA: 16c8f0dd643a3a249e28cc7cd31416eb8472c18d
  BASE_SHA: 1adc5239500a684824b178b19be4266f6e249cc8
  ATOMIC_NET_TAG: v1.0
  ATOMIC_NET_ASSET: atomic-run3b.nnue
  ATOMIC_NET_SHA256: 99dc67eabf26a64faeeca3a88b4c38597a840b8d4a874b9f2cf658c6f92a04a6
  NET_NAME: atomic_run3b_e202_l05.nnue
  SERVED_URL: https://belzedar.duckdns.org/atomicdb/engines
  EXPECT_NNUE: "409185"
  BENCH_DEPTH: "18"
  ROUNDS: "10"
  # The LLVM release the Linux binary is built with (apt.llvm.org packages).
  LLVM_VERSION: "23"

jobs:
  linux:
    name: linux x86-64-avx2 (clang 23, network on disk)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      ARCH: x86-64-avx2
      SERVED_FILE: Atomic-Stockfish-linux-x86_64
      SERVED_SHA256: 2990a6f47cb67e8e98aabaed525150ff899e733756988364c512a6d17787123f
      NEW_FILE: Atomic-Stockfish-linux-x86_64-pgo
      # Ubuntu 24.04's own clang, for a reference build only.
      UBUNTU_CLANG_VERSION: "18"
      # Four binaries are timed here and the runner is quiet: more rounds, so the
      # compilers can be told apart, at little cost.
      ROUNDS: "20"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.ENGINE_SHA }}
          path: engine
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false

      - name: Name the build after its commit
        # main carries the release number 1.0.3; a worker engine built from a later
        # commit must say which one, so it is built as a dev build, which prints
        # dev-<date>-<sha>. Only the version string changes, not the search.
        shell: python
        run: |
          import pathlib, re
          p = pathlib.Path('engine/src/atomic_version.h')
          text, n = re.subn(r'AtomicVersionString = "[^"]*"', 'AtomicVersionString = "dev"', p.read_text())
          assert n == 1, n
          p.write_text(text)
          print('engine/src/atomic_version.h: version string set to dev')

      # The LLVM project's own packages, installed with its llvm.sh and an explicit
      # version, plus llvm-N, which holds the llvm-profdata that must match the
      # compiler. The major version is pinned in LLVM_VERSION; the exact build
      # installed is printed in the next step.
      - name: Install clang ${{ env.LLVM_VERSION }} from apt.llvm.org
        run: |
          mkdir -p out
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/llvm.sh" https://apt.llvm.org/llvm.sh
          sudo bash "$RUNNER_TEMP/llvm.sh" "$LLVM_VERSION" > out/llvm-install.log 2>&1 || { tail -n 40 out/llvm-install.log; exit 1; }
          sudo apt-get install -y "llvm-$LLVM_VERSION" >> out/llvm-install.log 2>&1 || { tail -n 40 out/llvm-install.log; exit 1; }

      - name: Toolchain and host
        run: |
          g++ --version | head -n 1
          for cxx in "clang++-$LLVM_VERSION" "clang++-$UBUNTU_CLANG_VERSION"; do
            "$cxx" --version | head -n 1
            # the llvm-profdata the Makefile pairs with this compiler
            "$(dirname "$(readlink -f "$(command -v "$cxx")")")/llvm-profdata" --version | grep -i "llvm version"
            "$cxx" -v 2>&1 | grep "Selected GCC installation"
          done
          dpkg-query -W "clang-$LLVM_VERSION" "llvm-$LLVM_VERSION" "llvm-$LLVM_VERSION-linker-tools" "clang-$UBUNTU_CLANG_VERSION"
          command -v ld.lld || echo "no ld.lld on PATH: clang links with GNU ld and the LLVM gold plugin"
          ld --version | head -n 1
          ldd --version | head -n 1
          lscpu | grep -E 'Model name|^CPU\(s\)'
          git -C engine log -1 --format='engine: %H %s'

      - name: Network, served binary, tablebases
        run: |
          mkdir -p run out served tb
          curl -sSfL --retry 3 -o "run/$NET_NAME" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$ATOMIC_NET_TAG/$ATOMIC_NET_ASSET"
          echo "$ATOMIC_NET_SHA256  run/$NET_NAME" | sha256sum -c -
          cp "run/$NET_NAME" "engine/src/$NET_NAME"
          curl -sSfL --retry 3 -o "served/$SERVED_FILE" "$SERVED_URL/$SERVED_FILE"
          echo "$SERVED_SHA256  served/$SERVED_FILE" | sha256sum -c -
          chmod +x "served/$SERVED_FILE"
          python3 ci/fetch_tb.py "$SERVED_URL/syzygy-345" tb

      # Control: does a plain build of 1adc5239 on this image reproduce the served
      # binary bit for bit? If it does, that is how the served binary was built.
      - name: Rebuild the served binary from 1adc5239 (plain build)
        working-directory: base/src
        run: |
          make -j4 build ARCH=$ARCH COMP=gcc > ../../out/build-base.log 2>&1 || { tail -n 40 ../../out/build-base.log; exit 1; }
          sha256sum atomic-stockfish
          ls -l atomic-stockfish "../../served/$SERVED_FILE"
          if [ "$(sha256sum < atomic-stockfish | cut -d' ' -f1)" = "$SERVED_SHA256" ]; then
            echo "REPRODUCED: plain build of 1adc5239 is byte-identical to the served binary" | tee ../../out/reproduction.txt
          else
            echo "NOT byte-identical to the served binary" | tee ../../out/reproduction.txt
            size atomic-stockfish "../../served/$SERVED_FILE" | tee -a ../../out/reproduction.txt
          fi
          cp atomic-stockfish ../../out/base-1adc5239-plain

      - name: Plain build of the engine branch (control)
        working-directory: engine/src
        run: |
          make -j4 build ARCH=$ARCH COMP=gcc EXE=plain > ../../out/build-plain.log 2>&1 || { tail -n 40 ../../out/build-plain.log; exit 1; }
          cp plain ../../out/plain

      # The Makefile links clang builds with -latomic unless RTLIB=compiler-rt, its
      # only use of RTLIB. The engine calls nothing in libatomic, but the link would
      # still record libatomic.so.1 as needed, a library the served binary does not
      # need. RTLIB=compiler-rt only drops -latomic: the runtime is still libgcc.
      - name: Profile-guided build (clang ${{ env.LLVM_VERSION }})
        working-directory: engine/src
        run: |
          test -f "$NET_NAME"
          rc=0
          make -j4 profile-build ARCH=$ARCH COMP=clang CXX="clang++-$LLVM_VERSION" RTLIB=compiler-rt EXE="$NEW_FILE" > ../../out/build-pgo.log 2>&1 || rc=$?
          grep -E "^Step|Nodes searched|Nodes/second|Total time|WARNING|profiled|llvm-profdata" ../../out/build-pgo.log || true
          if [ "$rc" -ne 0 ]; then tail -n 60 ../../out/build-pgo.log; exit "$rc"; fi
          test -x "$NEW_FILE"
          if grep -q "WARNING: the profiling run found no NNUE network" ../../out/build-pgo.log; then
            echo "::error::the PGO network warning fired"; exit 1
          fi
          # The profiling run ends with the default bench: the NNUE signature.
          grep -q "Nodes searched  : $EXPECT_NNUE" ../../out/build-pgo.log
          grep -q "/usr/lib/llvm-$LLVM_VERSION/bin/llvm-profdata merge" ../../out/build-pgo.log
          grep -c -- "-fprofile-use=stockfish.profdata" ../../out/build-pgo.log
          cp "$NEW_FILE" "../../out/$NEW_FILE"

      - name: What the new binary needs from the system
        run: |
          req() { readelf -V -W "$1" | grep -oE '(GLIBC|GLIBCXX|CXXABI|GCC)_[0-9.]+' | LC_ALL=C sort -u; }
          need() { readelf -d -W "$1" | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/' | LC_ALL=C sort -u; }
          req "served/$SERVED_FILE" > out/served.req; req "out/$NEW_FILE" > out/new.req
          need "served/$SERVED_FILE" > out/served.needed; need "out/$NEW_FILE" > out/new.needed
          echo "needed libraries (served | new):"; paste -d'|' out/served.needed out/new.needed
          echo "symbol versions only the new binary needs:"; LC_ALL=C comm -13 out/served.req out/new.req | tee out/extra.req
          test ! -s out/extra.req
          diff out/served.needed out/new.needed
          readelf -n "out/$NEW_FILE" | grep -E "ISA|Build ID" || true
          readelf -p .comment "out/$NEW_FILE" | grep -E "GCC|clang"
          readelf -p .comment "out/$NEW_FILE" | grep -q "clang version $LLVM_VERSION\."

      # References for the timing only, never published: the profile-guided gcc
      # build this job published until now, and the clang build again with Ubuntu's
      # own clang, to show what the newer release brings.
      - name: Reference builds (profile-guided gcc, and clang ${{ env.UBUNTU_CLANG_VERSION }})
        working-directory: engine/src
        run: |
          make clean > /dev/null
          make -j4 profile-build ARCH=$ARCH COMP=gcc EXE=gcc-pgo > ../../out/build-gcc-pgo.log 2>&1 || { tail -n 60 ../../out/build-gcc-pgo.log; exit 1; }
          grep -q "Nodes searched  : $EXPECT_NNUE" ../../out/build-gcc-pgo.log
          cp gcc-pgo ../../out/gcc-pgo
          ref="clang$UBUNTU_CLANG_VERSION-pgo"
          make clean > /dev/null
          make -j4 profile-build ARCH=$ARCH COMP=clang CXX="clang++-$UBUNTU_CLANG_VERSION" RTLIB=compiler-rt EXE="$ref" > "../../out/build-$ref.log" 2>&1 || { tail -n 60 "../../out/build-$ref.log"; exit 1; }
          grep -q "Nodes searched  : $EXPECT_NNUE" "../../out/build-$ref.log"
          grep -q "/usr/lib/llvm-$UBUNTU_CLANG_VERSION/bin/llvm-profdata merge" "../../out/build-$ref.log"
          cp "$ref" "../../out/$ref"

      - name: Identity of the plain and profile-guided builds, and their speed
        run: |
          ref="clang$UBUNTU_CLANG_VERSION-pgo"
          python3 ci/engine_check.py --title "linux $ARCH on $(lscpu | sed -n 's/^Model name: *//p' | head -n 1)" \
            --bin "plain=out/plain" --bin "gcc-pgo=out/gcc-pgo" --bin "$ref=out/$ref" \
            --bin "clang$LLVM_VERSION-pgo=out/$NEW_FILE" \
            --cwd run --expect-nnue "$EXPECT_NNUE" \
            --depth "$BENCH_DEPTH" --rounds "$ROUNDS" --syzygy "$PWD/tb" \
            --json out/check.json --md "$GITHUB_STEP_SUMMARY" | tee out/check.log
          "out/$NEW_FILE" compiler < /dev/null | tee out/compiler.txt
          grep -q "dev-.*-${ENGINE_SHA:0:8}" out/compiler.txt
          (cd out && sha256sum "$NEW_FILE" gcc-pgo "$ref" plain base-1adc5239-plain | tee sha256.txt)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: worker-engine-linux
          path: out/
          if-no-files-found: error
          compression-level: 6

  # The gcc builds of Windows, references only: each checks its profile-guided
  # build against a plain build of the same commit. The windows-clang job checks
  # the published clang binary against the gcc-15.2.0-8 one.
  windows:
    name: windows x86-64-bmi2 gcc reference (${{ matrix.toolchain }})
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msys2-current, gcc-15.2.0-8]
    env:
      ARCH: x86-64-bmi2
      SERVED_FILE: Atomic-Stockfish-win-x86_64.exe
      SERVED_SHA256: 88a5c04e8ac111109c73749473343dd7ccf823361a23417b616978562cf78ed4
      NEW_FILE: Atomic-Stockfish-win-x86_64-gcc-pgo.exe
      MSYS2_REPO: https://repo.msys2.org/mingw/mingw64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.ENGINE_SHA }}
          path: engine
          persist-credentials: false

      - name: Set up MSYS2 (current MinGW gcc)
        if: matrix.toolchain == 'msys2-current'
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: mingw64
          path-type: inherit
          install: mingw-w64-x86_64-gcc make

      - name: Set up MSYS2 (no compiler yet)
        if: matrix.toolchain != 'msys2-current'
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: mingw64
          path-type: inherit
          install: make

      # The toolchain the served binary was built with: its strings say
      # "GCC: (Rev8, Built by MSYS2 project) 15.2.0" and its PE header says linker 2.45.
      - name: Install MinGW gcc 15.2.0-8 and the runtime of that date
        if: matrix.toolchain == 'gcc-15.2.0-8'
        run: |
          set -eo pipefail
          pacman -U --noconfirm --needed \
            "$MSYS2_REPO/mingw-w64-x86_64-gcc-15.2.0-8-any.pkg.tar.zst" \
            "$MSYS2_REPO/mingw-w64-x86_64-gcc-libs-15.2.0-8-any.pkg.tar.zst" \
            "$MSYS2_REPO/mingw-w64-x86_64-binutils-2.45-2-any.pkg.tar.zst" \
            "$MSYS2_REPO/mingw-w64-x86_64-crt-git-13.0.0.r271.g937a01534-1-any.pkg.tar.zst" \
            "$MSYS2_REPO/mingw-w64-x86_64-headers-git-13.0.0.r271.g937a01534-1-any.pkg.tar.zst" \
            "$MSYS2_REPO/mingw-w64-x86_64-winpthreads-13.0.0.r271.g937a01534-1-any.pkg.tar.zst" \
            "$MSYS2_REPO/mingw-w64-x86_64-libwinpthread-13.0.0.r271.g937a01534-1-any.pkg.tar.zst"

      - name: Name the build after its commit
        # main carries the release number 1.0.3; a worker engine built from a later
        # commit must say which one, so it is built as a dev build, which prints
        # dev-<date>-<sha>. Only the version string changes, not the search.
        shell: python
        run: |
          import pathlib, re
          p = pathlib.Path('engine/src/atomic_version.h')
          text, n = re.subn(r'AtomicVersionString = "[^"]*"', 'AtomicVersionString = "dev"', p.read_text())
          assert n == 1, n
          p.write_text(text)
          print('engine/src/atomic_version.h: version string set to dev')

      - name: Toolchain and host
        run: |
          set -eo pipefail
          g++ --version | head -n 1
          ld --version | head -n 1
          pacman -Q | grep -E "mingw-w64-x86_64-(gcc|gcc-libs|binutils|crt|crt-git|headers|headers-git|winpthreads|libwinpthread) " || true
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" || true
          echo "processors: $NUMBER_OF_PROCESSORS"
          git -C engine log -1 --format='engine: %H %s'
          python --version

      - name: Network, served binary, tablebases
        run: |
          set -eo pipefail
          mkdir -p run out served tb
          curl -sSfL --retry 3 -o "engine/src/$NET_NAME" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$ATOMIC_NET_TAG/$ATOMIC_NET_ASSET"
          echo "$ATOMIC_NET_SHA256  engine/src/$NET_NAME" | sha256sum -c -
          curl -sSfL --retry 3 -o "served/$SERVED_FILE" "$SERVED_URL/$SERVED_FILE"
          echo "$SERVED_SHA256  served/$SERVED_FILE" | sha256sum -c -
          python ci/fetch_tb.py "$SERVED_URL/syzygy-345" tb

      - name: Plain build of the engine branch (control)
        working-directory: engine/src
        run: |
          set -eo pipefail
          make -j4 build ARCH=$ARCH COMP=mingw EXE=plain.exe EXTRACXXFLAGS=-DATOMIC_NNUE_EMBEDDING > ../../out/build-plain.log 2>&1 || { tail -n 40 ../../out/build-plain.log; exit 1; }
          test "$(wc -c < plain.exe)" -gt "$(wc -c < "$NET_NAME")"
          cp plain.exe ../../out/plain.exe

      - name: Profile-guided build
        working-directory: engine/src
        run: |
          set -eo pipefail
          rc=0
          make -j4 profile-build ARCH=$ARCH COMP=mingw EXE="$NEW_FILE" EXTRAPROFILEFLAGS=-DATOMIC_NNUE_EMBEDDING > ../../out/build-pgo.log 2>&1 || rc=$?
          grep -E "^Step|Nodes searched|Nodes/second|Total time|WARNING|profiled" ../../out/build-pgo.log || true
          if [ "$rc" -ne 0 ]; then tail -n 60 ../../out/build-pgo.log; exit "$rc"; fi
          test -f "$NEW_FILE"
          if grep -q "WARNING: the profiling run found no NNUE network" ../../out/build-pgo.log; then
            echo "::error::the PGO network warning fired"; exit 1
          fi
          grep -q "Nodes searched  : $EXPECT_NNUE" ../../out/build-pgo.log
          test "$(wc -c < "$NEW_FILE")" -gt "$(wc -c < "$NET_NAME")"
          cp "$NEW_FILE" "../../out/$NEW_FILE"

      # The run directory holds no .nnue: a completed NNUE bench can only come from
      # the embedded network.
      - name: Identity of the plain and profile-guided builds, and their speed
        run: |
          set -eo pipefail
          test -z "$(ls run/*.nnue 2>/dev/null)"
          python ci/engine_check.py --title "windows $ARCH, ${{ matrix.toolchain }}" \
            --bin "plain=out/plain.exe" --bin "pgo=out/$NEW_FILE" \
            --cwd run --expect-nnue "$EXPECT_NNUE" \
            --depth "$BENCH_DEPTH" --rounds "$ROUNDS" --syzygy "$(cygpath -m "$PWD/tb")" \
            --json out/check.json --md "$(cygpath -m "$GITHUB_STEP_SUMMARY")" | tee out/check.log
          (cd run && printf 'compiler\nquit\n' | "../out/$NEW_FILE") | tee out/compiler.txt
          grep -q "dev-.*-${ENGINE_SHA:0:8}" out/compiler.txt
          objdump -p "out/$NEW_FILE" | grep "DLL Name" | tee out/new.dlls
          objdump -p "served/$SERVED_FILE" | grep "DLL Name" | tee out/served.dlls
          (cd out && sha256sum "$NEW_FILE" plain.exe | tee sha256.txt)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reference-windows-${{ matrix.toolchain }}
          path: out/
          if-no-files-found: error
          compression-level: 0

  # Windows is published from this job. It builds the same commit profile-guided
  # with the newest clang MSYS2 packages (clang64: libc++ linked statically, the
  # C runtime is Windows' own UCRT, so Windows 10 or later) and checks and times
  # it on one runner against the binary the gcc-15.2.0-8 leg uploaded, byte for
  # byte; that leg checked its binary against a plain build of the same commit.
  windows-clang:
    name: windows x86-64-bmi2 (MSYS2 clang, published; against gcc-15.2.0-8)
    needs: windows
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    env:
      ARCH: x86-64-bmi2
      GCC_FILE: Atomic-Stockfish-win-x86_64-gcc-pgo.exe
      NEW_FILE: Atomic-Stockfish-win-x86_64-pgo.exe
      # Windows runners are noisy (the 18-oct comparison read +2.0% +/- 2.8 after
      # 12 rounds), so many more alternating rounds than the other checks.
      CLANG_ROUNDS: "80"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.ENGINE_SHA }}
          path: engine
          persist-credentials: false

      # update: true brings the package databases up to date first. Without it the
      # installer's own databases are used, and on 18-oct they still gave clang 21.
      - name: Set up MSYS2 with its newest clang
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: mingw64
          path-type: inherit
          update: true
          install: >-
            make
            mingw-w64-x86_64-binutils
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-llvm

      - name: Download the gcc-15.2.0-8 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reference-windows-gcc-15.2.0-8
          path: gcc

      - name: Name the build after its commit
        # main carries the release number 1.0.3; a worker engine built from a later
        # commit must say which one, so it is built as a dev build, which prints
        # dev-<date>-<sha>. Only the version string changes, not the search.
        shell: python
        run: |
          import pathlib, re
          p = pathlib.Path('engine/src/atomic_version.h')
          text, n = re.subn(r'AtomicVersionString = "[^"]*"', 'AtomicVersionString = "dev"', p.read_text())
          assert n == 1, n
          p.write_text(text)
          print('engine/src/atomic_version.h: version string set to dev')

      - name: Toolchain and host
        run: |
          set -eo pipefail
          /clang64/bin/clang++ --version | head -n 1
          /clang64/bin/llvm-profdata --version | grep -i "llvm version"
          pacman -Q | grep -E "mingw-w64-clang-x86_64-(clang|llvm|lld|compiler-rt|libc\+\+|libunwind|crt-git|headers-git|winpthreads) " || true
          powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" || true
          echo "processors: $NUMBER_OF_PROCESSORS"
          git -C engine log -1 --format='engine: %H %s'
          python --version
          # the binary the gcc-15.2.0-8 leg uploaded, as it recorded it
          (cd gcc && sha256sum -c sha256.txt)

      - name: Network, tablebases
        run: |
          set -eo pipefail
          mkdir -p run out tb
          curl -sSfL --retry 3 -o "engine/src/$NET_NAME" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$ATOMIC_NET_TAG/$ATOMIC_NET_ASSET"
          echo "$ATOMIC_NET_SHA256  engine/src/$NET_NAME" | sha256sum -c -
          python ci/fetch_tb.py "$SERVED_URL/syzygy-345" tb

      # As on macOS, the clang PGO recipe replaces EXTRACXXFLAGS and does not read
      # EXTRAPROFILEFLAGS, so the embedding flag goes in through the environment.
      # libc++ 23 dropped many transitive includes, and numa.h at ENGINE_SHA uses
      # std::inserter on Windows without including <iterator> (upstream Stockfish
      # added it in 86433ca7). _LIBCPP_KEEP_TRANSITIVE_INCLUDES_LLVM23 brings back
      # the headers libc++ 22 included; it only adds includes, no code changes.
      - name: Profile-guided build (clang)
        working-directory: engine/src
        run: |
          set -eo pipefail
          export PATH="/clang64/bin:$PATH"
          rc=0
          CXXFLAGS="-DATOMIC_NNUE_EMBEDDING -D_LIBCPP_KEEP_TRANSITIVE_INCLUDES_LLVM23" make -j4 profile-build ARCH=$ARCH COMP=clang EXE="$NEW_FILE" > ../../out/build-pgo.log 2>&1 || rc=$?
          grep -E "^Step|Nodes searched|Nodes/second|Total time|WARNING|profiled|llvm-profdata" ../../out/build-pgo.log || true
          if [ "$rc" -ne 0 ]; then tail -n 60 ../../out/build-pgo.log; exit "$rc"; fi
          test -f "$NEW_FILE"
          if grep -q "WARNING: the profiling run found no NNUE network" ../../out/build-pgo.log; then
            echo "::error::the PGO network warning fired"; exit 1
          fi
          grep -q "Nodes searched  : $EXPECT_NNUE" ../../out/build-pgo.log
          grep -c -- "-fprofile-use=stockfish.profdata" ../../out/build-pgo.log
          test "$(wc -c < "$NEW_FILE")" -gt "$(wc -c < "$NET_NAME")"
          cp "$NEW_FILE" "../../out/$NEW_FILE"

      # The run directory holds no .nnue: a completed NNUE bench can only come from
      # the embedded network, in either binary.
      - name: Identity of the gcc and clang builds, and their speed
        run: |
          set -eo pipefail
          test -z "$(ls run/*.nnue 2>/dev/null)"
          python ci/engine_check.py --title "windows $ARCH, gcc-15.2.0-8 against MSYS2 clang" \
            --bin "gcc=gcc/$GCC_FILE" --bin "clang=out/$NEW_FILE" \
            --cwd run --expect-nnue "$EXPECT_NNUE" \
            --depth "$BENCH_DEPTH" --rounds "$CLANG_ROUNDS" --syzygy "$(cygpath -m "$PWD/tb")" \
            --json out/check.json --md "$(cygpath -m "$GITHUB_STEP_SUMMARY")" | tee out/check.log
          (cd run && printf 'compiler\nquit\n' | "../out/$NEW_FILE") | tee out/compiler.txt
          grep -q "dev-.*-${ENGINE_SHA:0:8}" out/compiler.txt
          grep -q "^Compiled by *: clang++ " out/compiler.txt
          objdump -p "out/$NEW_FILE" | grep "DLL Name" | tee out/new.dlls
          (cd out && sha256sum "$NEW_FILE" | tee sha256.txt)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: worker-engine-windows
          path: out/
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macos apple-silicon (clang, Xcode 15.4)
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      ARCH: apple-silicon
      SERVED_FILE: Atomic-Stockfish-darwin-arm64
      SERVED_SHA256: d2d2037696f63cd9210e8f8fd68e72c7c8d190aa316562e99ff4ef1beebd276a
      NEW_FILE: Atomic-Stockfish-darwin-arm64-pgo
      # The commit the served binary was built from: 1adc5239 plus its CI workflow.
      OLD_SHA: 6fc98b675c2e00c56c88800089f25b19f74c53c0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.ENGINE_SHA }}
          path: engine
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.OLD_SHA }}
          path: old
          persist-credentials: false

      - name: Name the build after its commit
        # main carries the release number 1.0.3; a worker engine built from a later
        # commit must say which one, so it is built as a dev build, which prints
        # dev-<date>-<sha>. Only the version string changes, not the search.
        shell: python
        run: |
          import pathlib, re
          p = pathlib.Path('engine/src/atomic_version.h')
          text, n = re.subn(r'AtomicVersionString = "[^"]*"', 'AtomicVersionString = "dev"', p.read_text())
          assert n == 1, n
          p.write_text(text)
          print('engine/src/atomic_version.h: version string set to dev')

      - name: Toolchain and host
        run: |
          if [ -d /Applications/Xcode_15.4.app ]; then sudo xcode-select -s /Applications/Xcode_15.4.app; fi
          xcodebuild -version | tr '\n' ' '; echo
          clang++ --version | head -n 2
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.ncpu
          sw_vers | tr '\n' ' '; echo
          git -C engine log -1 --format='engine: %H %s'

      - name: Network, served binary, tablebases
        run: |
          mkdir -p run out served tb
          curl -sSfL --retry 3 -o "engine/src/$NET_NAME" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$ATOMIC_NET_TAG/$ATOMIC_NET_ASSET"
          echo "$ATOMIC_NET_SHA256  engine/src/$NET_NAME" | shasum -a 256 -c -
          cp "engine/src/$NET_NAME" "old/src/$NET_NAME"
          curl -sSfL --retry 3 -o "served/$SERVED_FILE" "$SERVED_URL/$SERVED_FILE"
          echo "$SERVED_SHA256  served/$SERVED_FILE" | shasum -a 256 -c -
          chmod +x "served/$SERVED_FILE"
          python3 ci/fetch_tb.py "$SERVED_URL/syzygy-345" tb

      # Control: the recipe of the darwin-arm64-prebuilt branch, run again today.
      - name: Rebuild the served binary from 6fc98b67 (plain build)
        working-directory: old/src
        run: |
          make -j3 build ARCH=$ARCH COMP=clang EXE="$SERVED_FILE" EXTRACXXFLAGS=-DATOMIC_NNUE_EMBEDDING > ../../out/build-old.log 2>&1 || { tail -n 40 ../../out/build-old.log; exit 1; }
          strip "$SERVED_FILE"
          shasum -a 256 "$SERVED_FILE"
          if [ "$(shasum -a 256 < "$SERVED_FILE" | cut -d' ' -f1)" = "$SERVED_SHA256" ]; then
            echo "REPRODUCED: plain build of 6fc98b67 is byte-identical to the served binary" | tee ../../out/reproduction.txt
          else
            echo "NOT byte-identical to the served binary" | tee ../../out/reproduction.txt
            ls -l "$SERVED_FILE" "../../served/$SERVED_FILE" | tee -a ../../out/reproduction.txt
          fi

      - name: Plain build of the engine branch (control)
        working-directory: engine/src
        run: |
          make -j3 build ARCH=$ARCH COMP=clang EXE=plain EXTRACXXFLAGS=-DATOMIC_NNUE_EMBEDDING > ../../out/build-plain.log 2>&1 || { tail -n 40 ../../out/build-plain.log; exit 1; }
          strip plain
          test "$(wc -c < plain)" -gt "$(wc -c < "$NET_NAME")"
          cp plain ../../out/plain

      # The clang PGO recipe replaces EXTRACXXFLAGS and does not read
      # EXTRAPROFILEFLAGS, so the embedding flag goes in through the environment
      # (the Makefile keeps the caller's CXXFLAGS as ENV_CXXFLAGS in every sub-make).
      - name: Profile-guided build
        working-directory: engine/src
        run: |
          rc=0
          CXXFLAGS=-DATOMIC_NNUE_EMBEDDING make -j3 profile-build ARCH=$ARCH COMP=clang EXE="$NEW_FILE" > ../../out/build-pgo.log 2>&1 || rc=$?
          grep -E "^Step|Nodes searched|Nodes/second|Total time|WARNING|profiled|llvm-profdata" ../../out/build-pgo.log || true
          if [ "$rc" -ne 0 ]; then tail -n 60 ../../out/build-pgo.log; exit "$rc"; fi
          test -x "$NEW_FILE"
          if grep -q "WARNING: the profiling run found no NNUE network" ../../out/build-pgo.log; then
            echo "::error::the PGO network warning fired"; exit 1
          fi
          grep -q "Nodes searched  : $EXPECT_NNUE" ../../out/build-pgo.log
          grep -c -- "-fprofile-use=stockfish.profdata" ../../out/build-pgo.log
          strip "$NEW_FILE"
          test "$(wc -c < "$NEW_FILE")" -gt "$(wc -c < "$NET_NAME")"
          cp "$NEW_FILE" "../../out/$NEW_FILE"

      - name: Identity of the plain and profile-guided builds, and their speed
        run: |
          test -z "$(ls run/*.nnue 2>/dev/null)"
          python3 ci/engine_check.py --title "macos $ARCH on $(sysctl -n machdep.cpu.brand_string)" \
            --bin "plain=out/plain" --bin "pgo=out/$NEW_FILE" \
            --cwd run --expect-nnue "$EXPECT_NNUE" \
            --depth "$BENCH_DEPTH" --rounds "$ROUNDS" --syzygy "$PWD/tb" \
            --json out/check.json --md "$GITHUB_STEP_SUMMARY" | tee out/check.log
          "out/$NEW_FILE" compiler < /dev/null | tee out/compiler.txt
          grep -q "dev-.*-${ENGINE_SHA:0:8}" out/compiler.txt
          otool -L "out/$NEW_FILE" | tee out/new.dylibs
          otool -L "served/$SERVED_FILE" | tee out/served.dylibs
          otool -l "out/$NEW_FILE" | grep -A4 LC_BUILD_VERSION | tee out/new.buildversion
          codesign -dv "out/$NEW_FILE" 2>&1 | tee out/new.codesign
          (cd out && shasum -a 256 "$NEW_FILE" plain | tee sha256.txt)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: worker-engine-macos
          path: out/
          if-no-files-found: error
          compression-level: 0
